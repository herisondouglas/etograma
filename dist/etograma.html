<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Etograma de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: plataforma de pesquisa. Desktop = barra lateral fixa + área de trabalho de 1120px;
   celular = barra superior com seletor de experimento + barra de abas inferior para uso no curral. */
:root{
  --bg:#f4f6f1; --surface:#ffffff; --surface-2:#eef2ea; --ink:#12201a; --ink-2:#47564c; --muted:#76837a; --line:#e0e5db; --line-2:#cfd6c9;
  --accent:#136c3e; --accent-2:#e3f0e6; --accent-ink:#ffffff;
  --hay:#c98a00; --now:#fcf1d2; --rare:#7b4fa0; --rare-2:#f1e9f7;
  --good:#18794a; --good-2:#e2f3e8; --warn:#a86a00; --warn-2:#fbefd6; --bad:#bf3429; --bad-2:#fbe6e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100;
  --div-neg:#2a78d6; --div-pos:#eb6834; --div-mid:#eceee9;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:14px; --r-sm:10px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0d1310; --surface:#141c17; --surface-2:#1a241e; --ink:#e8eee9; --ink-2:#b3bfb6; --muted:#87958b; --line:#243029; --line-2:#2f3d35;
  --accent:#5ccf8a; --accent-2:#173424; --accent-ink:#06120b;
  --hay:#f2b73d; --now:#382c10; --rare:#c39be3; --rare-2:#291f34;
  --good:#4cc47f; --good-2:#16301f; --warn:#f0a830; --warn-2:#33270f; --bad:#f0766b; --bad-2:#3a1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --div-neg:#3987e5; --div-pos:#d95926; --div-mid:#222b25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0d1310; --surface:#141c17; --surface-2:#1a241e; --ink:#e8eee9; --ink-2:#b3bfb6; --muted:#87958b; --line:#243029; --line-2:#2f3d35;
  --accent:#5ccf8a; --accent-2:#173424; --accent-ink:#06120b;
  --hay:#f2b73d; --now:#382c10; --rare:#c39be3; --rare-2:#291f34;
  --good:#4cc47f; --good-2:#16301f; --warn:#f0a830; --warn-2:#33270f; --bad:#f0766b; --bad-2:#3a1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500;
  --div-neg:#3987e5; --div-pos:#d95926; --div-mid:#222b25; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:700;letter-spacing:-.015em;margin:0;line-height:1.08;text-wrap:balance}
h1{font-size:clamp(1.9rem,4.4vw,2.7rem);font-weight:800}
h2{font-size:1.45rem}
h3{font-size:1.12rem}
p{margin:0}
a{color:var(--accent)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--hay);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.eyebrow{font-size:.74rem;text-transform:uppercase;letter-spacing:.12em;font-weight:700;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:30;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:800;font-size:1.15rem;letter-spacing:-.02em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:8px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.expsel{flex:1;min-width:0;display:flex;justify-content:flex-end}
.expsel select{max-width:100%;min-height:38px;border:1px solid var(--line);background:var(--surface);border-radius:99px;padding:6px 32px 6px 14px;font-weight:600;font-size:.88rem;text-overflow:ellipsis}
.iconbtn{width:40px;height:40px;border-radius:99px;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
main{padding:20px 16px 110px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(5,1fr);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;font-size:.68rem;font-weight:600;color:var(--muted);border-radius:10px;min-height:52px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current=page]{color:var(--accent)}
.tabbar button[aria-current=page] .pip{background:var(--accent-2)}
.pip{padding:3px 14px;border-radius:99px;display:grid;place-items:center}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:960px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:22px;position:sticky;top:0;height:100vh;padding:22px 16px;border-right:1px solid var(--line);background:var(--surface)}
  .topbar,.tabbar{display:none}
  main{padding:34px 40px 60px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:10px;font-weight:600;color:var(--ink-2);text-align:left}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{background:var(--surface-2)}
  .side nav button[aria-current=page]{background:var(--accent-2);color:var(--accent)}
  .side .expbox{display:flex;flex-direction:column;gap:6px}
  .side .expbox select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:9px 10px;font-weight:600;min-height:42px;width:100%}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
}

/* ---------- elementos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:9px 18px;font-weight:600;min-height:44px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent);padding-inline:10px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.88rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.9rem;margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:700;font-size:1.9rem;letter-spacing:-.02em;line-height:1.1}
.kpi .v small{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .l{font-size:.82rem;color:var(--muted);font-weight:600}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px 3px 8px;border-radius:99px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.good{background:var(--good-2);color:var(--good)}
.pill.warn{background:var(--warn-2);color:var(--warn)}
.pill.bad{background:var(--bad-2);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--now);color:var(--ink);text-transform:uppercase;letter-spacing:.07em;vertical-align:middle}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .title{font-weight:700}
.item .sub{font-size:.86rem;color:var(--muted)}
.empty{padding:28px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--accent);border-radius:99px}
.note{font-size:.84rem;color:var(--muted)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.9rem;color:var(--ink-2)}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.callout.bad{background:var(--bad-2);color:var(--ink)}
.callout.bad svg{stroke:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:.86rem;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* página */
.page-h{display:flex;flex-direction:column;gap:8px;margin-bottom:22px}
.page-h .row{margin-top:6px}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--accent);font-weight:600;padding:4px 0;font-size:.9rem;align-self:flex-start}

/* hero do experimento */
.hero{border-radius:20px;padding:24px;background:var(--accent);color:var(--accent-ink);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero .eyebrow{color:inherit;opacity:.75}
.hero h1{color:inherit}
.hero .facts{display:flex;gap:28px;flex-wrap:wrap}
.hero .facts div{display:flex;flex-direction:column}
.hero .facts b{font-family:var(--display);font-size:1.5rem;font-weight:700;line-height:1.1}
.hero .facts span{font-size:.8rem;opacity:.8;font-weight:600}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.hero > *:not(canvas){position:relative}
.hero .btn{background:var(--accent-ink);color:var(--accent);border-color:transparent}
.hero .btn.ghost{background:transparent;color:var(--accent-ink);border-color:color-mix(in srgb,var(--accent-ink) 45%,transparent)}

/* formulários */
.form{display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem;color:var(--ink-2);min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:99px;padding:7px 14px 7px 10px;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--surface)}
.check input{accent-color:var(--accent);width:18px;height:18px}
.check:has(input:checked){border-color:var(--accent);background:var(--accent-2)}

/* tabelas */
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.t th{font-size:.72rem;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t input{min-height:38px;padding:6px 10px;max-width:120px}

/* observação */
.species{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.species{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;transition:border-color .15s,transform .1s}
.sp:hover{border-color:var(--accent)}
.sp:active{transform:scale(.98)}
.sp .gl{width:38px;height:38px;border-radius:11px;background:var(--accent-2);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.2rem;margin-bottom:auto}
.sp .name{font-family:var(--display);font-weight:700;font-size:1.3rem;margin-top:14px}
.sp .meta{font-size:.82rem;color:var(--muted)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.clock{font-family:var(--mono);font-weight:600;font-size:2.7rem;line-height:1;letter-spacing:-.04em}
.countdown{font-weight:700;font-size:.92rem}
.countdown.due{color:var(--hay)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:99px;padding:8px 16px;font-weight:700;white-space:nowrap;min-height:40px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:12px;padding:12px;font-weight:600;text-align:left;min-height:56px;display:flex;align-items:center;gap:10px;line-height:1.2;transition:background .12s,border-color .12s}
.chip .box{flex:none;width:22px;height:22px;border-radius:7px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--accent);background:var(--accent-2)}
.chip[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rare[aria-pressed=true]{border-color:var(--rare);background:var(--rare-2)}
.chip.rare[aria-pressed=true] .box{background:var(--rare);border-color:var(--rare);color:var(--surface)}
.sub-h{font-size:.72rem;text-transform:uppercase;letter-spacing:.11em;color:var(--muted);font-weight:700}
.sheetbox{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:.88rem;width:max-content;min-width:100%}
.sheet th,.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.sheet thead th{position:sticky;top:0;background:var(--surface);z-index:3;font-weight:700;font-size:.7rem;line-height:1.15;padding:8px 4px;width:64px;min-width:64px;vertical-align:bottom;color:var(--ink-2)}
.sheet thead th.rare{color:var(--rare)}
.sheet th.time{position:sticky;left:0;z-index:2;background:var(--surface);font-family:var(--mono);font-size:.9rem;font-weight:600;width:66px;min-width:66px;padding:0 6px}
.sheet thead th.time{z-index:4;font-family:var(--body);font-size:.7rem}
.sheet td.cell button{width:100%;height:38px;border:0;background:transparent;font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--accent)}
.sheet td.cell.rare{background:var(--rare-2)}
.sheet td.cell.rare button{color:var(--rare)}
.sheet td.cell.on{background:var(--accent-2)}
.sheet td.obs{min-width:190px;padding:0 4px}
.sheet td.obs input{border:0;background:transparent;min-height:36px;padding:6px;width:100%;box-shadow:none}
.sheet tr.isnow th.time,.sheet tr.isnow td{background:var(--now)}
.sheet tr.isnow th.time{color:var(--hay)}
.sheet tr.day td{background:var(--surface-2);text-align:left;padding:6px 12px;font-weight:700;font-size:.76rem;color:var(--muted)}

/* gráficos */
.viz{width:100%;overflow-x:auto}
.viz svg{display:block;max-width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--body);fill:var(--muted);font-size:11px}
.viz .lbl{fill:var(--ink-2);font-size:12px;font-weight:600}
.viz .val{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--mono)}
.viz .grid line{stroke:var(--line);stroke-width:1}
.viz .axis{stroke:var(--line-2);stroke-width:1}
.viz [data-tip]{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:.8rem;font-weight:600;max-width:260px;line-height:1.35;white-space:pre-line}
.statline{display:flex;gap:22px;flex-wrap:wrap}
.statline div{display:flex;flex-direction:column}
.statline b{font-family:var(--mono);font-size:1.15rem;font-weight:600}
.statline span{font-size:.76rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.07em}
.verdict{border-radius:var(--r-sm);padding:14px 16px;font-size:.95rem;line-height:1.5;background:var(--surface-2)}
.verdict.sig{background:var(--good-2)}
.verdict b{font-weight:700}
.ai-out{white-space:pre-wrap;font-size:.95rem;line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:16px;min-height:60px}

/* visão IA */
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.frame img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--surface-2);max-width:100%}
.frame .fb{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.frame .fb .t{font-family:var(--mono);font-weight:600}
.mini{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--accent-2);color:var(--accent);margin:0 4px 4px 0}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}

<div id="root"></div>
<script>
/* ===== Estatística (funções puras) ===== */
const Stats=(function(){
  function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
  function betacf(a,b,x){const MAXIT=300,EPS=3e-14,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}return h}
  function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
  const pT=(t,df)=>df>0&&isFinite(t)?ibeta(df/(df+t*t),df/2,.5):NaN;          // bicaudal
  const pF=(F,d1,d2)=>(d1>0&&d2>0&&isFinite(F))?ibeta(d2/(d2+d1*F),d2/2,d1/2):NaN;
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
  const se=a=>sd(a)/Math.sqrt(a.length);
  function pearson(xs,ys){
    const P=xs.map((x,i)=>[x,ys[i]]).filter(([x,y])=>isFinite(x)&&isFinite(y));const n=P.length;
    if(n<3)return{n,r:NaN,p:NaN};
    const mx=mean(P.map(p=>p[0])),my=mean(P.map(p=>p[1]));let sxy=0,sxx=0,syy=0;
    for(const[x,y]of P){sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2}
    if(!sxx||!syy)return{n,r:NaN,p:NaN};
    const r=sxy/Math.sqrt(sxx*syy),b=sxy/sxx,a=my-b*mx,df=n-2;
    const t=Math.abs(r)>=1?Infinity:r*Math.sqrt(df/(1-r*r));
    return{n,r,r2:r*r,p:isFinite(t)?pT(t,df):0,a,b,df,t};
  }
  function anova(groups){ // groups: [{nome, vals:[]}]
    const G=groups.map(g=>({...g,vals:g.vals.filter(v=>isFinite(v))})).filter(g=>g.vals.length);
    const all=G.flatMap(g=>g.vals),N=all.length,k=G.length;
    const desc=G.map(g=>({nome:g.nome,n:g.vals.length,media:mean(g.vals),dp:sd(g.vals),ep:se(g.vals)}));
    if(k<2||N-k<1)return{desc,k,N,F:NaN,p:NaN};
    const gm=mean(all);let ssb=0,ssw=0;
    for(const g of G){const m=mean(g.vals);ssb+=g.vals.length*(m-gm)**2;for(const v of g.vals)ssw+=(v-m)**2}
    const dfb=k-1,dfw=N-k,msb=ssb/dfb,msw=ssw/dfw,F=msw>0?msb/msw:Infinity;
    const p=isFinite(F)?pF(F,dfb,dfw):0;
    // comparações par a par: t usando QM do resíduo, Bonferroni
    const pares=[];const m=k*(k-1)/2;
    for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){const a=G[i],b=G[j];const t=(mean(a.vals)-mean(b.vals))/Math.sqrt(msw*(1/a.vals.length+1/b.vals.length));const pr=Math.min(1,pT(Math.abs(t),dfw)*m);pares.push({a:a.nome,b:b.nome,dif:mean(a.vals)-mean(b.vals),p:pr})}
    return{desc,k,N,ssb,ssw,dfb,dfw,msb,msw,F,p,pares,cv:100*Math.sqrt(msw)/gm};
  }
  function niceTicks(min,max,count){
    if(!isFinite(min)||!isFinite(max))return[0,1];
    if(min===max){const d=Math.abs(min)||1;min-=d*.1;max+=d*.1}
    const span=max-min,step0=span/Math.max(1,count),mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag;
    const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
    const out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(10));return out;
  }
  return{lgamma,ibeta,pT,pF,mean,sd,se,pearson,anova,niceTicks};
})();
if(typeof module!=="undefined")module.exports=Stats;

</script>
<script>
(function(){
"use strict";
/* ================= utilidades ================= */
const KEY="etograma.v2",KEY1="etograma.v1";
const uid=()=>Math.random().toString(36).slice(2,9);
const esc=s=>String(s??"").replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const pad=n=>String(n).padStart(2,"0");
const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
const dmy=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
const isoDay=d=>d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());
const parseDay=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
const fmt=(v,d=1)=>isFinite(v)?Number(v).toLocaleString("pt-BR",{minimumFractionDigits:d,maximumFractionDigits:d}):"—";
const fmtP=p=>!isFinite(p)?"—":p<0.001?"< 0,001":fmt(p,3);
const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
const fmtDur=min=>{min=Math.round(min);const h=Math.floor(min/60),m=min%60;return h?(h+" h"+(m?" "+pad(m):"")):m+" min"};
function rng(seed){return function(){seed|=0;seed=seed+0x6D2B79F5|0;let t=Math.imul(seed^seed>>>15,1|seed);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function gauss(r){let u=0,v=0;while(!u)u=r();while(!v)v=r();return Math.sqrt(-2*Math.log(u))*Math.cos(2*Math.PI*v)}

/* ================= ícones ================= */
const IC={
  home:'<path d="M3 10.5 12 3l9 7.5"/><path d="M5 9.5V21h14V9.5"/><path d="M10 21v-6h4v6"/>',

  spark:'<path d="M12 3v4M12 17v4M3 12h4M17 12h4M6 6l2.5 2.5M15.5 15.5 18 18M6 18l2.5-2.5M15.5 8.5 18 6"/>',
  info:'<circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/>',
  film:'<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M7 4v16M17 4v16M3 9h4M3 15h4M17 9h4M17 15h4"/>',
  x:'<path d="M6 6l12 12M18 6 6 18"/>'
};
const icon=(n,cls="i")=>`<svg class="${cls}" viewBox="0 0 24 24" aria-hidden="true">${IC[n]}</svg>`;

/* ================= dados padrão ================= */
function B(nome,tipo){return{id:uid(),nome,tipo:tipo||"comum"}}
function defaultSpecies(){return[
  {id:"vaca",nome:"Vaca",comp:[B("Comendo"),B("Ruminando"),B("Bebendo água"),B("Ócio"),B("Deitada"),B("Em pé"),B("Defecando"),B("Urinando"),B("Se coçando / esfregando","raro"),B("Esperneando","raro")]},
  {id:"cavalo",nome:"Cavalo",comp:[B("Comendo"),B("Bebendo água"),B("Ócio"),B("Deitado"),B("Em pé"),B("Andando"),B("Defecando"),B("Urinando"),B("Rolando","raro"),B("Escoiceando","raro"),B("Se coçando / esfregando","raro")]},
  {id:"ovelha",nome:"Ovelha",comp:[B("Comendo"),B("Ruminando"),B("Bebendo água"),B("Ócio"),B("Deitada"),B("Em pé"),B("Andando"),B("Defecando"),B("Urinando"),B("Se coçando / esfregando","raro"),B("Esperneando","raro")]},
  {id:"galinha",nome:"Galinha",comp:[B("Comendo"),B("Bebendo água"),B("Ciscando"),B("Empoleirada"),B("Deitada"),B("Andando"),B("Arrumando penas"),B("Banho de terra"),B("Bicando outra ave","raro"),B("Ofegando","raro")]}
]}

/* Exemplo realista: confinamento com 12 vacas em 2 dietas, 3 pesagens, consumo e 24 h de etograma */
function exampleData(species){
  const r=rng(20261010);const sp=species.find(s=>s.id==="vaca")||species[0];
  const today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-56);
  const gA={id:"gA",nome:"Dieta A",dieta:"80% concentrado",gmdMeta:1.4},gB={id:"gB",nome:"Dieta B",dieta:"50% concentrado + silagem",gmdMeta:1.0};
  const animais=[];for(let i=1;i<=12;i++)animais.push({id:"a"+i,brinco:pad(i),grupoId:i%2?"gA":"gB"});
  const truth={};
  animais.forEach(a=>{const A=a.grupoId==="gA";
    const eat=(A?215:265)+gauss(r)*22,rum=(A?395:505)+gauss(r)*35;
    let gmd=(A?1.46:1.03)+gauss(r)*.09-.0015*(rum-(A?395:505))+.001*(eat-(A?215:265));
    if(a.id==="a5")gmd=1.08; if(a.id==="a8")gmd=.74;
    truth[a.id]={eat,rum,gmd,p0:Math.round(372+gauss(r)*18),cms:(A?10.6:9.7)+gauss(r)*.55};});
  const dates=[0,28,56].map(d=>{const x=new Date(start);x.setDate(x.getDate()+d);return isoDay(x)});
  const pesagens=dates.map((d,k)=>({id:uid(),data:d,pesos:Object.fromEntries(animais.map(a=>{const t=truth[a.id];return[a.id,Math.round((t.p0+t.gmd*k*28+gauss(r)*2.5)*2)/2]}))}));
  const consumo=dates.slice(1).map(d=>({id:uid(),data:d,valores:Object.fromEntries(animais.map(a=>[a.id,Math.round((truth[a.id].cms+gauss(r)*.25)*10)/10]))}));
  const exp={id:"exemplo",exemplo:true,nome:"Confinamento Nelore",especieId:sp.id,especie:sp.nome,responsavel:"Raquel",inicio:dates[0],grupos:[gA,gB],animais,pesagens,consumo};
  // etograma 24 h, 6 observadores × 2 animais
  const sessStart=new Date(start);sessStart.setDate(sessStart.getDate()+50);sessStart.setHours(7,0,0,0);
  const comp=sp.comp.map(c=>({...c}));const id=n=>comp.find(c=>c.nome.startsWith(n))?.id;
  const sessions=[];
  for(let o=0;o<6;o++){
    const pair=[animais[o*2],animais[o*2+1]];
    const s={id:uid(),exemplo:true,expId:exp.id,nome:"Etograma 24 h · dia 50",especie:sp.nome,comp,observador:"Observador "+(o+1),animais:pair.map(a=>a.brinco),animalIds:pair.map(a=>a.id),inicio:sessStart.getTime(),intervalo:5,duracao:24,marks:{},obs:{}};
    pair.forEach((a,k)=>{const t=truth[a.id];const pE=t.eat/1440,pR=t.rum/1440,pW=.022,pI=Math.max(.05,1-pE-pR-pW);
      s.marks[k]={};s.obs[k]={};let st="Ócio";
      for(let i=0;i<288;i++){const h=(7+i*5/60)%24;
        let wE=pE*((h>=7&&h<9.5)||(h>=15&&h<17.5)?3.2:h<5||h>21?.35:1),wR=pR*(h<6||h>20?1.5:.85),wW=pW,wI=pI;
        if(r()>.72){const tot=wE+wR+wW+wI,x=r()*tot;st=x<wE?"Comendo":x<wE+wR?"Ruminando":x<wE+wR+wW?"Bebendo água":"Ócio"}
        const lying=(st==="Ruminando"||st==="Ócio")&&r()<(h<6||h>20?.75:.45);
        const m=[id(st),id(lying?"Deitada":"Em pé")];
        if(r()<.035)m.push(id("Defecando"));if(r()<.028)m.push(id("Urinando"));if(r()<.008)m.push(id("Se coçando"));
        s.marks[k][i]=m.filter(Boolean);}
    });
    sessions.push(s);
  }
  sessions[2].obs[1][40]="Se esfregou no cocho";
  return{exp,sessions};
}

/* ================= armazenamento ================= */
function fresh(){const species=defaultSpecies();const ex=exampleData(species);return{v:2,species,experiments:[ex.exp],sessions:ex.sessions,active:ex.exp.id}}
function load(){
  try{const raw=localStorage.getItem(KEY);if(raw){const d=JSON.parse(raw);if(d&&d.v===2)return d}}catch(e){}
  const d=fresh();
  try{const raw=localStorage.getItem(KEY1);if(raw){const o=JSON.parse(raw);if(o&&o.species)d.species=o.species;if(o&&o.sessions)d.sessions.push(...o.sessions.filter(s=>!s.exemplo).map(s=>({...s,expId:null})))}}catch(e){}
  return d;
}
let db=load();
function save(){try{localStorage.setItem(KEY,JSON.stringify(db))}catch(e){}}
const exp=()=>db.experiments.find(e=>e.id===db.active)||null;
const grupo=(e,gid)=>e.grupos.find(g=>g.id===gid);
const gIndex=(e,gid)=>Math.max(0,e.grupos.findIndex(g=>g.id===gid));
const gColor=(e,gid)=>`var(--s${gIndex(e,gid)%4+1})`;

/* ================= cálculos ================= */
function performance(e){
  const pes=[...e.pesagens].sort((a,b)=>a.data<b.data?-1:1);
  return e.animais.map(a=>{
    const pts=pes.filter(p=>isFinite(p.pesos[a.id])).map(p=>({d:p.data,w:+p.pesos[a.id]}));
    const g=grupo(e,a.grupoId)||{};const o={id:a.id,brinco:a.brinco,grupoId:a.grupoId,grupo:g.nome||"—",meta:+g.gmdMeta,pts};
    if(pts.length){o.p0=pts[0].w;o.pf=pts[pts.length-1].w}
    if(pts.length>=2){o.dias=dayDiff(pts[0].d,pts[pts.length-1].d);o.gmd=o.dias>0?(o.pf-o.p0)/o.dias:NaN}
    const cs=e.consumo.map(c=>+c.valores[a.id]).filter(isFinite);o.cms=cs.length?Stats.mean(cs):NaN;
    o.ca=isFinite(o.cms)&&o.gmd>0?o.cms/o.gmd:NaN;
    o.pv=isFinite(o.cms)&&isFinite(o.p0)?100*o.cms/((o.p0+o.pf)/2):NaN;
    if(isFinite(o.gmd)&&o.meta>0){o.ratio=o.gmd/o.meta;o.status=o.ratio>=1.1?"acima":o.ratio>=.9?"ok":"abaixo"}else o.status="sem";
    return o;});
}
function sessionAnimalId(e,s,k){
  if(s.animalIds&&s.animalIds[k])return s.animalIds[k];
  const n=norm(s.animais[k]);const a=e.animais.find(a=>norm(a.brinco)===n||n.endsWith(" "+norm(a.brinco)));return a?a.id:null;
}
function behaviorVars(e){
  const acc={},names={};
  db.sessions.filter(s=>s.expId===e.id).forEach(s=>{
    s.animais.forEach((_,k)=>{const aid=sessionAnimalId(e,s,k);if(!aid)return;
      const M=s.marks[k]||{};const A=acc[aid]=acc[aid]||{obs:0,c:{}};
      for(const i in M){const arr=M[i];if(!arr||!arr.length)continue;A.obs++;
        for(const cid of arr){const c=s.comp.find(x=>x.id===cid);if(!c)continue;const key="b:"+norm(c.nome);names[key]=c.nome;A.c[key]=(A.c[key]||0)+1}}
    });});
  const vars=Object.keys(names).map(k=>({key:k,nome:names[k]+" (min/dia)",curto:names[k],comp:true}));
  const by={};for(const aid in acc){by[aid]={};for(const v of vars)by[aid][v.key]=acc[aid].obs?(acc[aid].c[v.key]||0)/acc[aid].obs*1440:NaN;by[aid]._obs=acc[aid].obs}
  return{vars,by};
}
function dataset(e){
  const P=performance(e),BV=behaviorVars(e);
  const base=[{key:"p0",nome:"Peso inicial (kg)"},{key:"pf",nome:"Peso atual (kg)"},{key:"gmd",nome:"GMD (kg/dia)"},{key:"cms",nome:"Consumo de MS (kg/dia)"},{key:"ca",nome:"Conversão alimentar (kg MS/kg)"}];
  const rows=P.map(p=>({id:p.id,brinco:p.brinco,grupoId:p.grupoId,grupo:p.grupo,v:{p0:p.p0,pf:p.pf,gmd:p.gmd,cms:p.cms,ca:p.ca,...(BV.by[p.id]||{})}}));
  const vars=[...base,...BV.vars].filter(v=>rows.filter(r=>isFinite(r.v[v.key])).length>=3);
  return{rows,vars,perf:P};
}

/* ================= gráficos (SVG) ================= */
function cw(full){const cs=getComputedStyle(app);const inner=app.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight);const col=full||inner<672?inner:(inner-16)/2;return Math.max(290,Math.min(full?1000:620,Math.round(col-42)))}
function hbars(rows,{max,unit="",fmtv=v=>fmt(v,2),markerLabel="meta"}={}){const W=cw(false);
  const lw=92,vw=78,bw=W-lw-vw-8,rh=30;max=max||Math.max(...rows.map(r=>Math.max(r.value||0,r.marker||0)),1);
  const H=rows.length*rh+8;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  rows.forEach((r,i)=>{const y=i*rh+4,w=Math.max(0,(r.value||0)/max*bw);
    s+=`<text class="lbl" x="${lw-10}" y="${y+rh/2+4}" text-anchor="end">${esc(r.label)}</text>`;

function scatter(pts,reg,xl,yl){const W=cw(true);

function lines(series,yl){const W=cw(false);

function heat(vars,M){const W=cw(true);
  const n=vars.length,lw=150,cell=Math.max(30,Math.min(46,(W-lw)/n)),H=n*cell+lw-40,Wd=lw+n*cell;
  const col=r=>{if(!isFinite(r))return"var(--surface-2)";const t=Math.min(1,Math.abs(r));return`color-mix(in srgb,${r<0?"var(--div-neg)":"var(--div-pos)"} ${Math.round(t*100)}%,var(--div-mid))`};
  let s=`<svg viewBox="0 0 ${Wd+4} ${H}" role="img" style="width:${Wd+4}px;max-width:none">`;
  vars.forEach((v,i)=>{s+=`<text class="lbl" x="${lw-8}" y="${lw-40+i*cell+cell/2+4}" text-anchor="end" style="font-size:11px">${esc(v.curto||v.nome)}</text>`;
    s+=`<text class="lbl" transform="translate(${lw+i*cell+cell/2+4} ${lw-48}) rotate(-50)" style="font-size:11px">${esc(v.curto||v.nome)}</text>`;});
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){const r=M[i][j],x=lw+j*cell,y=lw-40+i*cell;
    s+=`<rect x="${x+1}" y="${y+1}" width="${cell-2}" height="${cell-2}" rx="4" fill="${col(r.r)}" data-heat="${i},${j}" data-tip="${esc(vars[i].nome)} × ${esc(vars[j].nome)}\nr = ${fmt(r.r,2)} · p = ${fmtP(r.p)}" style="cursor:pointer"/>`;
    if(i!==j&&isFinite(r.r))s+=`<text x="${x+cell/2}" y="${y+cell/2+4}" text-anchor="middle" style="font-size:10.5px;font-weight:600;fill:${Math.abs(r.r)>.55?"#fff":"var(--ink)"};pointer-events:none">${fmt(r.r,1)}${r.p<.05?"*":""}</text>`;}
  return s+"</svg>";
}
const BAND_COLORS=[["comendo","var(--s2)","Comendo"],["ruminando","var(--s1)","Ruminando"],["ocio","var(--s3)","Ócio"],["bebendo agua","var(--s4)","Bebendo água"]];
function bands(rowsData,interval){const W=cw(true);
  const lw=58,rh=20,gap=6,n=Math.max(...rowsData.map(r=>r.slots.length)),cwd=(W-lw)/n,H=rowsData.length*(rh+gap)+24;
  let s=`<svg viewBox="0 0 ${W} ${H}" role="img">`;
  rowsData.forEach((row,ri)=>{const y=ri*(rh+gap);s+=`<text class="lbl" x="${lw-10}" y="${y+rh/2+4}" text-anchor="end">${esc(row.label)}</text><rect x="${lw}" y="${y}" width="${W-lw}" height="${rh}" rx="4" fill="var(--surface-2)"/>`;
    let i=0;while(i<row.slots.length){const c=row.slots[i];let j=i;while(j+1<row.slots.length&&row.slots[j+1]===c)j++;
      if(c>=0){const b=BAND_COLORS[c];s+=`<rect x="${lw+i*cwd}" y="${y}" width="${(j-i+1)*cwd}" height="${rh}" fill="${b[1]}" data-tip="${esc(row.label)} · ${b[2]}\n${row.time(i)}–${row.time(j+1)} (${fmtDur((j-i+1)*interval)})"/>`}

  return s+"</svg>";
}

function ethogramCard(e){
  const sess=db.sessions.filter(s=>s.expId===e.id&&s.comp.some(c=>BAND_COLORS.some(b=>b[0]===norm(c.nome))));
  if(!sess.length)return"";

  const S=sess.filter(s=>parseDay(isoDay(new Date(s.inicio))).getTime()===latestDay);
  const rows=[];
  S.forEach(s=>s.animais.forEach((nm,k)=>{const M=s.marks[k]||{};const n=Math.round(s.duracao*60/s.intervalo);const slots=[];
    for(let i=0;i<n;i++){const arr=(M[i]||[]).map(cid=>norm((s.comp.find(c=>c.id===cid)||{}).nome));slots.push(BAND_COLORS.findIndex(b=>arr.includes(b[0])))}
    const aid=sessionAnimalId(e,s,k);const a=e.animais.find(x=>x.id===aid);
    rows.push({label:a?a.brinco:nm,g:a?gIndex(e,a.grupoId):99,slots,time:i=>hhmm(new Date(s.inicio+i*s.intervalo*60000))});}));
  rows.sort((a,b)=>a.g-b.g||a.label.localeCompare(b.label,undefined,{numeric:true}));
  const iv=S[0].intervalo;
  return`<section class="card" style="margin-top:16px">
    <div class="card-h"><div><h3>Orçamento de tempo · 24 h</h3><p>Cada faixa é um animal; cada traço, uma marcação de ${iv} min. Registro de ${dmy(new Date(S[0].inicio))}.</p></div><button class="btn sm" id="toObs">Abrir registros</button></div>
    <div class="viz">${bands(rows.slice(0,16),iv)}</div>
    <div class="legend">${BAND_COLORS.map(b=>`<span><i class="dot" style="background:${b[1]}"></i>${b[2]}</span>`).join("")}<span><i class="dot" style="background:var(--surface-2);border:1px solid var(--line-2)"></i>Outro / sem marcação</span></div>
  </section>`;
}

  </form>`;
  wireBack({name:"dash"});
  const gs=$("#gs",app);
  const addG=g=>{const c=document.createElement("div");c.className="card";c.dataset.gid=g.id;
    c.innerHTML=`<div class="fields"><label class="f">Tratamento<input type="text" data-k="nome" value="${esc(g.nome)}"></label><label class="f">Descrição da dieta<input type="text" data-k="dieta" value="${esc(g.dieta||"")}" placeholder="Ex.: 80% concentrado"></label><label class="f">Meta de GMD <span class="hint">kg/dia esperado</span><input type="number" step="0.01" min="0" data-k="gmdMeta" value="${g.gmdMeta}"></label></div>
    <label class="f">Brincos dos animais <span class="hint">separados por vírgula</span><textarea data-k="brincos" rows="2" placeholder="01, 03, 05, 07">${esc(g.brincos)}</textarea></label>
    <div><button type="button" class="btn sm quiet danger" data-rm>Remover tratamento</button></div>`;
    $("[data-rm]",c).onclick=()=>{if(gs.children.length>1)c.remove()};gs.appendChild(c)};
  grupos.forEach(addG);
  $("#addG",app).onclick=()=>addG({id:uid(),nome:"Dieta "+String.fromCharCode(65+gs.children.length),dieta:"",gmdMeta:1,brincos:""});
  if(ed)$("#delX",app).onclick=ev=>{const b=ev.currentTarget;if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Confirmar: apagar experimento e seus registros?";return}
    db.experiments=db.experiments.filter(x=>x!==ed);db.sessions=db.sessions.filter(s=>s.expId!==ed.id);db.active=db.experiments[0]?.id||null;save();toast("Experimento apagado");go({name:"dash"})};
  $("#f",app).onsubmit=ev=>{ev.preventDefault();
    const sp=db.species.find(s=>s.id===$("#xSp",app).value);
    const G=[],A=[];
    $$("[data-gid]",gs).forEach(c=>{const g={id:c.dataset.gid,nome:$('[data-k="nome"]',c).value.trim()||"Tratamento",dieta:$('[data-k="dieta"]',c).value.trim(),gmdMeta:parseFloat($('[data-k="gmdMeta"]',c).value)||0};G.push(g);
      $('[data-k="brincos"]',c).value.split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean).forEach(b=>{const old=ed?.animais.find(a=>a.brinco===b);A.push({id:old?.id||uid(),brinco:b,grupoId:g.id})})});

    if(ed){Object.assign(ed,data)}else{const x={id:uid(),...data,pesagens:[],consumo:[]};db.experiments.push(x);db.active=x.id}
    save();toast(ed?"Experimento salvo":"Experimento criado");go({name:"dash"});
  };
};

/* ================= OBSERVAR ================= */
const nSlots=s=>Math.round(s.duracao*60/s.intervalo);
const slotDate=(s,i)=>new Date(s.inicio+i*s.intervalo*60000);
function currentSlot(s){const i=Math.floor((Date.now()-s.inicio)/(s.intervalo*60000));return(i>=0&&i<nSlots(s))?i:null}
const marked=(s,a,i)=>(s.marks[a]&&s.marks[a][i])||[];
function filledCount(s){let n=0;for(const a in s.marks)for(const i in s.marks[a])if(s.marks[a][i].length)n++;return n}

VIEWS.obsHome=function(){
  const e=exp();
  const mine=db.sessions.filter(s=>e?s.expId===e.id:false).sort((a,b)=>b.inicio-a.inicio);
  const loose=db.sessions.filter(s=>!s.expId).sort((a,b)=>b.inicio-a.inicio);
  const list=arr=>arr.length?`<div class="list">${arr.map(s=>{const tot=nSlots(s)*s.animais.length,f=filledCount(s);return`<div class="item">
      <div class="grow stack" style="gap:6px"><div><div class="title">${esc(s.nome)} <span class="muted" style="font-weight:500">· ${esc(s.observador||"sem observador")}</span></div>
      <div class="sub">${esc(s.especie)} · animais ${esc(s.animais.join(", "))} · ${dmy(new Date(s.inicio))} às ${hhmm(new Date(s.inicio))} · a cada ${s.intervalo} min</div></div>
      <div class="progress" title="${f} de ${tot} marcações"><span style="width:${Math.round(100*f/Math.max(tot,1))}%"></span></div></div>
      <button class="btn sm" data-open="${s.id}">Abrir</button><button class="btn sm quiet danger" data-del="${s.id}">Apagar</button></div>`}).join("")}</div>`:"";
  app.innerHTML=pageHead("Observar","Análise comportamental","Escolha o animal, marque o que ele está fazendo a cada intervalo e acompanhe a planilha se formando.")+`
  ${e?`<section class="card" style="margin-bottom:18px"><div class="card-h"><div><h3>Nova observação em ${esc(e.nome)}</h3><p>${esc(e.especie)} · ${e.animais.length} animais do experimento</p></div><button class="btn primary" id="newExpObs">${icon("plus")}Começar</button></div></section>`:""}
  <section class="stack" style="margin-bottom:22px"><h3>Observação avulsa</h3><p class="note" style="margin-top:-6px">Sem vínculo com experimento: escolha o animal.</p>
    <div class="species">${db.species.map(s=>`<button class="sp" data-sp="${esc(s.id)}"><span class="gl" aria-hidden="true">${esc(s.nome.charAt(0))}</span><span class="name">${esc(s.nome)}</span><span class="meta">${s.comp.length} comportamentos</span></button>`).join("")}</div>
  </section>
  <section class="stack">
    <h2>Registros${e?` · ${esc(e.nome)}`:""}</h2>
    ${list(mine)||`<div class="list"><div class="empty">Nenhuma observação neste experimento ainda.</div></div>`}
    ${loose.length?`<h3 style="margin-top:10px">Avulsas</h3>${list(loose)}`:""}
    <p class="note">Os registros ficam salvos neste aparelho. Para juntar o trabalho de vários observadores, cada um exporta a planilha e você importa em Ajustes.</p>
  </section>`;
  if(e)$("#newExpObs",app).onclick=()=>go({name:"setup",sp:e.especieId,exp:true});
  $$("[data-sp]",app).forEach(b=>b.onclick=()=>go({name:"setup",sp:b.dataset.sp,exp:false}));
  $$("[data-open]",app).forEach(b=>b.onclick=()=>go({name:"sheet",id:b.dataset.open,animal:0}));
  $$("[data-del]",app).forEach(b=>b.onclick=()=>{if(b.dataset.armed){db.sessions=db.sessions.filter(s=>s.id!==b.dataset.del);save();render();toast("Observação apagada")}else{b.dataset.armed=1;b.textContent="Confirmar?"}});
};

  <form class="form" id="f"><div class="card">
    <div class="fields">
      <label class="f">Nome<input type="text" id="nome" value="${e?"Etograma 24 h":"Observação"}"></label>

      <label class="f">Hora de início<input type="time" id="hora" value="${hhmm(now)}" required></label>
      <label class="f">Intervalo entre marcações<select id="int">${[1,2,5,10,15,30].map(v=>`<option value="${v}"${v===5?" selected":""}>${v} min</option>`).join("")}</select></label>
      <label class="f">Duração<select id="dur">${[1,2,4,6,8,12,24,48].map(v=>`<option value="${v}"${v===24?" selected":""}>${v} h</option>`).join("")}</select></label>
    </div>

      ${e?`<div class="checks">${e.animais.map(a=>`<label class="check"><input type="checkbox" value="${a.id}"><span>${esc(a.brinco)}</span><i class="dot" style="background:${gColor(e,a.grupoId)}" title="${esc(grupo(e,a.grupoId)?.nome||"")}"></i></label>`).join("")}</div>
      <div class="legend">${e.grupos.map((g,i)=>`<span><i class="dot" style="background:var(--s${i%4+1})"></i>${esc(g.nome)}</span>`).join("")}</div>`
      :`<div class="stack" id="animals" style="gap:8px"></div><div><button type="button" class="btn sm quiet" id="addA">${icon("plus")}Adicionar animal</button></div>`}
    </div>

  <div class="row"><button class="btn primary" type="submit">Começar observação</button></div></form>`;
  wireBack({name:"obsHome"});
  const box=$("#animals",app);
  const count=()=>e?$$(".checks input:checked",app).length:box.children.length;
  const calc=()=>{const i=+$("#int",app).value,h=+$("#dur",app).value,n=count(),k=Math.round(h*60/i);$("#calc",app).textContent=`${k} marcações por animal${n?` · ${k*n} no total para ${n} animal(is)`:""}.`};
  if(!e){const addRow=v=>{const r=document.createElement("div");r.className="row";r.style.flexWrap="nowrap";const id="an"+uid();r.innerHTML=`<input type="text" id="${id}" aria-label="Animal" value="${esc(v)}" style="flex:1;min-width:0"><button type="button" class="btn sm quiet danger" aria-label="Remover animal">${icon("x")}</button>`;$("button",r).onclick=()=>{if(box.children.length>1){r.remove();calc()}};box.appendChild(r);calc()};
    addRow(sp.nome+" 1");addRow(sp.nome+" 2");$("#addA",app).onclick=()=>addRow(sp.nome+" "+(box.children.length+1));}
  else $$(".checks input",app).forEach(c=>c.onchange=calc);
  $("#int",app).onchange=calc;$("#dur",app).onchange=calc;calc();

VIEWS.sheet=function(){
  const s=db.sessions.find(x=>x.id===view.id);if(!s)return go({name:"obsHome"});
  const a=Math.min(view.animal||0,s.animais.length-1);
  const comuns=s.comp.filter(c=>c.tipo!=="raro"),raros=s.comp.filter(c=>c.tipo==="raro"),cols=[...comuns,...raros];
  const cur=currentSlot(s);const focus=view.slot!=null?view.slot:(cur!=null?cur:0);
  const e=s.expId?db.experiments.find(x=>x.id===s.expId):null;
  app.innerHTML=pageHead(`${esc(s.especie)} · ${esc(s.observador||"sem observador")} · a cada ${s.intervalo} min`,esc(s.nome),e?`Experimento ${esc(e.nome)}`:"",`<button class="btn sm" id="sum">Resumo</button><button class="btn sm" id="exp">${icon("down")}Exportar planilha</button><button class="btn sm" id="vis">${icon("eye")}Preencher com IA</button>`,"Observar")+`
  <div class="stack-lg">
  <div class="tabs" role="tablist">${s.animais.map((n,i)=>`<button class="tab" role="tab" aria-selected="${i===a}" data-a="${i}">${esc(n)}</button>`).join("")}</div>
  <section class="now" aria-live="polite">
    <div class="spread">
      <div><div class="sub-h" id="slotLabel"></div><div class="clock" id="slotTime"></div></div>
      <div class="stack" style="align-items:flex-end;gap:8px"><div class="countdown" id="cd"></div>
        <div class="row"><button class="btn sm" id="prev" aria-label="Horário anterior">${icon("back")}</button><button class="btn sm" id="goNow">Agora</button><button class="btn sm" id="next" aria-label="Próximo horário"><svg class="i" viewBox="0 0 24 24" style="transform:scaleX(-1)">${IC.back}</svg></button></div></div>
    </div>
    <div class="sub-h">O que ${esc(s.animais[a])} está fazendo?</div>
    <div class="chips" id="chips"></div>
    <input type="text" id="obsNow" placeholder="Observação deste horário (opcional)" aria-label="Observação deste horário">
  </section>
  <section class="stack">
    <div class="spread"><h2>Planilha · ${esc(s.animais[a])}</h2><span class="note">Toque numa célula para marcar ou desmarcar</span></div>
    <div class="sheetbox" id="sheetbox"><table class="sheet"><thead><tr><th class="time">Hora</th>${cols.map(c=>`<th class="${c.tipo==="raro"?"rare":""}" scope="col">${esc(c.nome)}</th>`).join("")}<th scope="col" style="width:auto;text-align:left;padding-left:10px">Observação</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section></div>`;
  wireBack({name:"obsHome"});
  const tb=$("#tb",app);let html="",lastDay="";
  for(let i=0;i<nSlots(s);i++){const d=slotDate(s,i),day=dmy(d);
    if(day!==lastDay){html+=`<tr class="day"><td colspan="${cols.length+2}">${day}</td></tr>`;lastDay=day}
    const mk=marked(s,a,i);
    html+=`<tr data-i="${i}"${i===cur?' class="isnow"':""}><th class="time" scope="row">${hhmm(d)}</th>${cols.map(c=>{const on=mk.includes(c.id);return`<td class="cell${c.tipo==="raro"?" rare":""}${on?" on":""}"><button data-c="${c.id}" aria-label="${esc(c.nome)} às ${hhmm(d)}" aria-pressed="${on}">${on?"X":""}</button></td>`}).join("")}<td class="obs"><input type="text" data-o="${i}" value="${esc((s.obs[a]||{})[i]||"")}" aria-label="Observação às ${hhmm(d)}"></td></tr>`;}
  tb.innerHTML=html;
  function toggle(i,cid){s.marks[a]=s.marks[a]||{};const arr=s.marks[a][i]||[];s.marks[a][i]=arr.includes(cid)?arr.filter(x=>x!==cid):[...arr,cid];if(!s.marks[a][i].length)delete s.marks[a][i];save();paintRow(i);if(i===view.slot)paintChips()}
  function paintRow(i){const tr=tb.querySelector(`tr[data-i="${i}"]`);if(!tr)return;const mk=marked(s,a,i);$$("button[data-c]",tr).forEach(b=>{const on=mk.includes(b.dataset.c);b.textContent=on?"X":"";b.setAttribute("aria-pressed",on);b.parentElement.classList.toggle("on",on)})}
  function paintChips(){const i=view.slot,mk=marked(s,a,i),d=slotDate(s,i);
    $("#slotTime",app).textContent=hhmm(d);$("#slotLabel",app).textContent=(i===currentSlot(s)?"Marcação de agora":"Marcação")+` · ${i+1} de ${nSlots(s)} · ${dmy(d)}`;
    const ch=c=>{const on=mk.includes(c.id);return`<button class="chip${c.tipo==="raro"?" rare":""}" aria-pressed="${on}" data-c="${c.id}"><span class="box">${on?"X":""}</span>${esc(c.nome)}</button>`};
    $("#chips",app).innerHTML=comuns.map(ch).join("")+(raros.length?`<div class="sub-h" style="grid-column:1/-1;margin-top:4px">Fora do comum</div>`+raros.map(ch).join(""):"");
    $("#obsNow",app).value=(s.obs[a]||{})[i]||"";}
  function setSlot(i,scroll){view.slot=Math.max(0,Math.min(nSlots(s)-1,i));paintChips();
    if(scroll){const tr=tb.querySelector(`tr[data-i="${view.slot}"]`),box=$("#sheetbox",app);if(tr)box.scrollTop=tr.offsetTop-box.clientHeight/2}}
  function updateClock(){const c=currentSlot(s),el=$("#cd",app);if(!el)return;
    $$("tr.isnow",tb).forEach(r=>{if(+r.dataset.i!==c)r.classList.remove("isnow")});if(c!=null){const tr=tb.querySelector(`tr[data-i="${c}"]`);if(tr)tr.classList.add("isnow")}
    if(Date.now()<s.inicio){const ms=s.inicio-Date.now();el.textContent="Começa em "+Math.floor(ms/60000)+" min "+pad(Math.floor(ms/1000)%60)+" s";el.classList.remove("due")}
    else if(c==null){el.textContent="Período de observação encerrado";el.classList.remove("due")}
    else{const ms=s.inicio+(c+1)*s.intervalo*60000-Date.now(),done=marked(s,a,c).length>0;
      el.textContent=done?`Próxima marcação em ${Math.floor(ms/60000)}:${pad(Math.floor(ms/1000)%60)}`:`Marque o horário ${hhmm(slotDate(s,c))}`;el.classList.toggle("due",!done);
      if(lastSlot!=null&&lastSlot!==c){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(err){}if(view.slot===lastSlot)setSlot(c,true)}lastSlot=c}}
  tb.addEventListener("click",ev=>{const b=ev.target.closest("button[data-c]");if(!b)return;const i=+b.closest("tr").dataset.i;toggle(i,b.dataset.c);if(view.slot!==i)setSlot(i,false)});
  tb.addEventListener("change",ev=>{const inp=ev.target.closest("input[data-o]");if(!inp)return;s.obs[a]=s.obs[a]||{};const v=inp.value.trim();if(v)s.obs[a][inp.dataset.o]=v;else delete s.obs[a][inp.dataset.o];save();if(+inp.dataset.o===view.slot)$("#obsNow",app).value=v});
  $("#chips",app).addEventListener("click",ev=>{const b=ev.target.closest("button[data-c]");if(b)toggle(view.slot,b.dataset.c)});
  $("#obsNow",app).addEventListener("change",ev=>{s.obs[a]=s.obs[a]||{};const v=ev.target.value.trim();if(v)s.obs[a][view.slot]=v;else delete s.obs[a][view.slot];save();const inp=tb.querySelector(`input[data-o="${view.slot}"]`);if(inp)inp.value=v});
  $("#prev",app).onclick=()=>setSlot(view.slot-1,true);$("#next",app).onclick=()=>setSlot(view.slot+1,true);
  $("#goNow",app).onclick=()=>{const c=currentSlot(s);setSlot(c!=null?c:(Date.now()<s.inicio?0:nSlots(s)-1),true)};
  $$("[data-a]",app).forEach(b=>b.onclick=()=>{view.animal=+b.dataset.a;render()});
  $("#sum",app).onclick=()=>go({name:"summary",id:s.id,animal:a});
  $("#exp",app).onclick=()=>exportSession(s);
  $("#vis",app).onclick=()=>go({name:"vision",sid:s.id,animal:a});
  setSlot(focus,true);lastSlot=null;tick=setInterval(updateClock,1000);updateClock();
  try{if(!wake&&navigator.wakeLock)navigator.wakeLock.request("screen").then(w=>wake=w).catch(()=>{})}catch(err){}
};

VIEWS.summary=function(){
  const s=db.sessions.find(x=>x.id===view.id);if(!s)return go({name:"obsHome"});
  app.innerHTML=pageHead(`Resumo · ${esc(s.especie)}`,esc(s.nome),`Tempo estimado = nº de marcações × ${s.intervalo} min. A porcentagem é sobre os horários já marcados de cada animal.`,`<button class="btn sm" id="exp">${icon("down")}Exportar planilha</button>`,"Planilha")+
  `<div class="grid g2">${s.animais.map((n,a)=>{const slots=Object.keys(s.marks[a]||{}).filter(i=>(s.marks[a][i]||[]).length),obsN=slots.length;
    const rows=s.comp.map(c=>{const k=slots.filter(i=>s.marks[a][i].includes(c.id)).length;return{label:c.nome,value:k*s.intervalo,color:c.tipo==="raro"?"var(--rare)":"var(--accent)",tip:`${c.nome}: ${k} marcações · ${obsN?Math.round(100*k/obsN):0}% · ${fmtDur(k*s.intervalo)}`}});
    return`<section class="card"><div class="card-h"><div><h3>${esc(n)}</h3><p>${obsN} de ${nSlots(s)} horários marcados · ${fmtDur(obsN*s.intervalo)} observadas</p></div></div>
    ${obsN?`<div class="viz">${hbars(rows,{fmtv:v=>fmtDur(v)})}</div>`:`<p class="muted">Nenhum horário marcado ainda.</p>`}</section>`}).join("")}</div>`;
  wireBack({name:"sheet",id:s.id,animal:view.animal||0});$("#exp",app).onclick=()=>exportSession(s);
};

/* ================= DESEMPENHO ================= */
VIEWS.perf=function(){
  const e=exp();if(!e){app.innerHTML=pageHead("Desempenho","Desempenho dos animais")+needExp();return wireNeedExp()}
  const P=performance(e);const ord={abaixo:0,ok:1,acima:2,sem:3};

let statState={v:null,x:null,y:null};
function corrWords(r,p){const a=Math.abs(r);const f=a<.3?"fraca":a<.6?"moderada":"forte";return`Correlação <b>${f} e ${r>0?"positiva":"negativa"}</b> (r = ${fmt(r,2)}). `+(p<.05?`Ela é <b>estatisticamente significativa</b> (p = ${fmtP(p)}): é pouco provável que seja acaso.`:`<b>Não é significativa</b> (p = ${fmtP(p)}): com esses dados, pode ser acaso.`)}
VIEWS.stats=function(){

  const V=D.vars;if(!V.find(v=>v.key===statState.v))statState.v=(V.find(v=>v.key==="gmd")||V[0]).key;
  if(!V.find(v=>v.key===statState.x))statState.x=(V.find(v=>v.key==="b:ruminando")||V[0]).key;
  if(!V.find(v=>v.key===statState.y))statState.y=(V.find(v=>v.key==="gmd")||V[1]||V[0]).key;

  <div class="stack-lg">
  <section class="card" id="aiBox" hidden><div class="card-h"><div><h3>Leitura dos resultados</h3><p>Escrita por IA a partir dos números abaixo. Confira antes de usar em trabalho.</p></div><button class="btn sm" id="aiStop" hidden>Parar</button></div><div class="ai-out" id="aiOut"></div></section>
  <section class="card">
    <div class="card-h"><div><h3>Comparar tratamentos</h3><p>ANOVA de um fator. Com mais de 2 grupos, comparações par a par com correção de Bonferroni.</p></div>

    <div id="anovaOut" class="stack"></div>
  </section>
  <section class="card">
    <div class="card-h"><div><h3>Relação entre duas variáveis</h3><p>Correlação de Pearson e reta de regressão. Ex.: tempo ruminando × ganho de peso.</p></div>
      <div class="row" style="align-items:flex-end"><label class="f" style="min-width:200px">Eixo X<select id="sx">${opt(statState.x)}</select></label><label class="f" style="min-width:200px">Eixo Y<select id="sy">${opt(statState.y)}</select></label></div></div>
    <div id="corrOut" class="stack"></div>
  </section>
  <section class="card">
    <div class="card-h"><div><h3>Mapa de correlações</h3><p>Todas as variáveis contra todas. Azul = negativa, laranja = positiva; * = significativa (p &lt; 0,05). Toque num quadrado para ver o gráfico.</p></div></div>
    <div class="viz" id="heat"></div>
  </section>
  <section class="stack"><h3>Dados por animal</h3>
    <div class="tablebox"><table class="t"><thead><tr><th>Animal</th><th>Tratamento</th>${V.map(v=>`<th class="r">${esc(v.nome)}</th>`).join("")}</tr></thead><tbody>
    ${D.rows.map(r=>`<tr><td><b>${esc(r.brinco)}</b></td><td>${esc(r.grupo)}</td>${V.map(v=>`<td class="r num">${fmt(r.v[v.key],v.comp?0:2)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
  </div>`;
  const cols=e.grupos.map((g,i)=>`var(--s${i%4+1})`);
  function doAnova(){const v=V.find(x=>x.key===statState.v);const res=Stats.anova(e.grupos.map(g=>({nome:g.nome,vals:D.rows.filter(r=>r.grupoId===g.id).map(r=>r.v[v.key])})));
    const unit=(v.nome.match(/\(([^)]+)\)/)||[])[1]||"";const best=[...res.desc].sort((a,b)=>b.media-a.media)[0];
    const sig=res.p<.05;
    $("#anovaOut",app).innerHTML=res.desc.length<2?`<p class="muted">Precisa de pelo menos 2 tratamentos com dados.</p>`:`
      <div class="verdict${sig?" sig":""}">${sig?`Os tratamentos <b>diferem</b> em ${esc(v.nome)} (p = ${fmtP(res.p)}). Maior média: <b>${esc(best.nome)}</b>, ${fmt(best.media,2)} ${esc(unit)}.`:`<b>Não houve diferença significativa</b> entre os tratamentos em ${esc(v.nome)} (p = ${fmtP(res.p)}).`}</div>
      <div class="statline"><div><b>${fmt(res.F,2)}</b><span>F</span></div><div><b>${res.dfb}; ${res.dfw}</b><span>gl</span></div><div><b>${fmtP(res.p)}</b><span>p</span></div><div><b>${fmt(res.cv,1)}%</b><span>CV</span></div></div>
      <div class="viz">${meanBars(res.desc.map(d=>({...d,nome:d.nome})),res.desc.map(d=>cols[e.grupos.findIndex(g=>g.nome===d.nome)]),unit)}</div>
      <div class="tablebox"><table class="t"><thead><tr><th>Tratamento</th><th class="r">n</th><th class="r">Média</th><th class="r">Desvio-padrão</th><th class="r">Erro-padrão</th></tr></thead><tbody>${res.desc.map(d=>`<tr><td>${esc(d.nome)}</td><td class="r num">${d.n}</td><td class="r num">${fmt(d.media,2)}</td><td class="r num">${fmt(d.dp,2)}</td><td class="r num">${fmt(d.ep,2)}</td></tr>`).join("")}</tbody></table></div>
      ${res.pares&&res.pares.length>1?`<div class="tablebox"><table class="t"><thead><tr><th>Comparação</th><th class="r">Diferença</th><th class="r">p (Bonferroni)</th></tr></thead><tbody>${res.pares.map(p=>`<tr><td>${esc(p.a)} × ${esc(p.b)}</td><td class="r num">${fmt(p.dif,2)}</td><td class="r num">${fmtP(p.p)}${p.p<.05?" *":""}</td></tr>`).join("")}</tbody></table></div>`:""}`;
    statState.anova={v:v.nome,res};}
  function doCorr(){const vx=V.find(x=>x.key===statState.x),vy=V.find(x=>x.key===statState.y);
    const rows=D.rows.filter(r=>isFinite(r.v[vx.key])&&isFinite(r.v[vy.key]));const c=Stats.pearson(rows.map(r=>r.v[vx.key]),rows.map(r=>r.v[vy.key]));
    statState.corr={x:vx.nome,y:vy.nome,c};

      <div class="verdict${c.p<.05?" sig":""}">${corrWords(c.r,c.p)}${vx.key!==vy.key?` A reta indica que cada 1 unidade a mais em <i>${esc(vx.nome)}</i> está associada a ${fmt(c.b,3)} em <i>${esc(vy.nome)}</i>.`:""}</div>
      <div class="statline"><div><b>${fmt(c.r,3)}</b><span>r</span></div><div><b>${fmt(c.r2,3)}</b><span>R²</span></div><div><b>${fmtP(c.p)}</b><span>p</span></div><div><b>${c.n}</b><span>n</span></div><div><b>y = ${fmt(c.a,3)} ${c.b<0?"−":"+"} ${fmt(Math.abs(c.b),4)}x</b><span>Equação</span></div></div>
      <div class="viz">${scatter(rows.map(r=>({x:r.v[vx.key],y:r.v[vy.key],color:gColor(e,r.grupoId),tip:`Animal ${r.brinco} · ${r.grupo}\n${vx.nome}: ${fmt(r.v[vx.key],2)}\n${vy.nome}: ${fmt(r.v[vy.key],2)}`})),c,vx.nome,vy.nome)}</div>
      <div class="legend">${e.grupos.map((g,i)=>`<span><i class="dot" style="background:var(--s${i%4+1});border-radius:50%"></i>${esc(g.nome)}</span>`).join("")}<span><svg width="22" height="8"><line x1="0" x2="22" y1="4" y2="4" stroke="var(--ink-2)" stroke-width="2" stroke-dasharray="5 4"/></svg>Reta de regressão</span></div>`;}
  function doHeat(){const M=V.map(a=>V.map(b=>{const rows=D.rows.filter(r=>isFinite(r.v[a.key])&&isFinite(r.v[b.key]));return Stats.pearson(rows.map(r=>r.v[a.key]),rows.map(r=>r.v[b.key]))}));
    statState.heat=V.map((a,i)=>V.map((b,j)=>j>i&&M[i][j].p<.05?`${a.nome} × ${b.nome}: r=${fmt(M[i][j].r,2)}, p=${fmtP(M[i][j].p)}`:null)).flat().filter(Boolean);
    $("#heat",app).innerHTML=heat(V,M);
    $$("[data-heat]",app).forEach(r=>r.addEventListener("click",()=>{const[i,j]=r.dataset.heat.split(",").map(Number);statState.x=V[j].key;statState.y=V[i].key;$("#sx",app).value=statState.x;$("#sy",app).value=statState.y;doCorr();$("#corrOut",app).closest(".card").scrollIntoView({behavior:"smooth",block:"start"})}));}
  $("#sv",app).onchange=ev=>{statState.v=ev.target.value;doAnova()};
  $("#sx",app).onchange=ev=>{statState.x=ev.target.value;doCorr()};$("#sy",app).onchange=ev=>{statState.y=ev.target.value;doCorr()};
  doAnova();doCorr();doHeat();
  $("#exD",app).onclick=()=>saveFile(`${e.nome} - dados por animal.csv`,toCSV([["Animal","Tratamento",...V.map(v=>v.nome)],...D.rows.map(r=>[r.brinco,r.grupo,...V.map(v=>r.v[v.key])])]));

      const prompt=`Você é um zootecnista experiente ajudando estudantes de graduação. Interprete, em português do Brasil e linguagem simples, os resultados do experimento "${e.nome}" (${e.especie}; tratamentos: ${e.grupos.map(g=>`${g.nome}${g.dieta?" — "+g.dieta:""}, meta de GMD ${g.gmdMeta} kg/dia`).join("; ")}).

function shrink(blobOrFile,maxW=1024){return new Promise((res,rej)=>{const img=new Image();img.onload=()=>{const k=Math.min(1,maxW/img.naturalWidth),c=document.createElement("canvas");c.width=Math.round(img.naturalWidth*k);c.height=Math.round(img.naturalHeight*k);c.getContext("2d").drawImage(img,0,0,c.width,c.height);c.toBlob(b=>b?res(b):rej(new Error("img")),"image/jpeg",.82)};img.onerror=()=>rej(new Error("img"));img.src=URL.createObjectURL(blobOrFile)})}
async function extractFrames(file,every,max,signal,onProg){
  const v=document.createElement("video");v.muted=true;v.playsInline=true;v.preload="auto";v.src=URL.createObjectURL(file);
  await new Promise((res,rej)=>{v.onloadeddata=res;v.onerror=()=>rej(new Error("video"))});
  const times=[];for(let t=0;t<=v.duration&&times.length<max;t+=every)times.push(Math.min(t,Math.max(0,v.duration-.05)));
  const k=Math.min(1,960/v.videoWidth),c=document.createElement("canvas");c.width=Math.round(v.videoWidth*k);c.height=Math.round(v.videoHeight*k);const ctx=c.getContext("2d");
  const out=[];for(let i=0;i<times.length;i++){if(signal.aborted)throw new Error("abort");
    await new Promise(res=>{v.onseeked=res;v.currentTime=times[i]});ctx.drawImage(v,0,0,c.width,c.height);
    const blob=await new Promise(res=>c.toBlob(res,"image/jpeg",.8));out.push({t:times[i],blob});onProg&&onProg(i+1,times.length)}
  return out;
}

function toCSV(rows){return"﻿"+rows.map(r=>r.map(v=>{if(typeof v==="number")v=isFinite(v)?String(+v.toFixed(4)).replace(".",","):"";v=String(v??"");return/[;"\n]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n")}
function sessionCSV(s){const head=["Experimento","Espécie","Observador","Animal","Data","Hora","Intervalo (min)",...s.comp.map(c=>c.nome),"Observação"];const rows=[head];
  s.animais.forEach((n,a)=>{for(let i=0;i<nSlots(s);i++){const d=slotDate(s,i),mk=marked(s,a,i);rows.push([s.nome,s.especie,s.observador,n,dmy(d),hhmm(d),String(s.intervalo),...s.comp.map(c=>mk.includes(c.id)?"1":"0"),(s.obs[a]||{})[i]||""])}});return toCSV(rows)}
function exportSession(s){saveFile((s.nome+" - "+(s.observador||"observador")+" - "+s.animais.join(", ")).replace(/[\\/:*?"<>|]/g,"-")+".csv",sessionCSV(s))}
function parseCSV(txt){txt=txt.replace(/^﻿/,"");const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
  if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}
  else if(ch==='"')q=true;else if(ch===";"){row.push(f);f=""}else if(ch==="\n"){row.push(f.replace(/\r$/,""));rows.push(row);row=[];f=""}else f+=ch}
  if(f||row.length){row.push(f.replace(/\r$/,""));rows.push(row)}return rows.filter(r=>r.some(x=>x!==""))}
function importCSV(txt){
  const R=parseCSV(txt);const h=R[0].map(norm);const ix=n=>h.indexOf(norm(n));
  const iE=ix("Experimento"),iS=ix("Espécie"),iO=ix("Observador"),iA=ix("Animal"),iD=ix("Data"),iH=ix("Hora"),iI=ix("Intervalo (min)"),iObs=ix("Observação");
  if(iA<0||iD<0||iH<0)throw new Error("fmt");
  const first=Math.max(iH,iI)+1,last=iObs>=0?iObs:R[0].length;const compNames=R[0].slice(first,last);
  const e=exp();const spName=R[1][iS]||e?.especie||"Animal";const sp=db.species.find(x=>norm(x.nome)===norm(spName));
  const comp=compNames.map(n=>{const ref=sp?.comp.find(c=>norm(c.nome)===norm(n));return{id:uid(),nome:n,tipo:ref?.tipo||"comum"}});
  const toTs=(d,t)=>{const[D,M,Y]=d.split("/").map(Number),[hh,mm]=t.split(":").map(Number);return new Date(Y,M-1,D,hh,mm).getTime()};
  const groups={};R.slice(1).forEach(r=>{const k=(r[iE]||"")+"|"+(r[iO]||"");(groups[k]=groups[k]||[]).push(r)});
  let n=0;for(const k in groups){const rows=groups[k];const animais=[...new Set(rows.map(r=>r[iA]))];
    const t0=Math.min(...rows.map(r=>toTs(r[iD],r[iH])));const a0=rows.filter(r=>r[iA]===animais[0]).map(r=>toTs(r[iD],r[iH])).sort((a,b)=>a-b);
    const intervalo=iI>=0&&+rows[0][iI]?+rows[0][iI]:(a0.length>1?Math.round((a0[1]-a0[0])/60000):5);
    const tEnd=Math.max(...rows.map(r=>toTs(r[iD],r[iH])));const duracao=Math.max(intervalo/60,(tEnd-t0)/36e5+intervalo/60);
    const s={id:uid(),expId:e?e.id:null,nome:rows[0][iE]||"Observação importada",especie:sp?.nome||spName,comp,observador:rows[0][iO]||"",animais,animalIds:null,inicio:t0,intervalo,duracao,marks:{},obs:{}};
    if(e)s.animalIds=animais.map((_,i)=>sessionAnimalId(e,s,i));
    animais.forEach((_,i)=>{s.marks[i]={};s.obs[i]={}});
    rows.forEach(r=>{const a=animais.indexOf(r[iA]),i=Math.round((toTs(r[iD],r[iH])-t0)/(intervalo*60000));const m=comp.filter((c,j)=>r[first+j]==="1"||norm(r[first+j])==="x").map(c=>c.id);if(m.length)s.marks[a][i]=m;if(iObs>=0&&r[iObs])s.obs[a][i]=r[iObs]});
    db.sessions.push(s);n++}
  return n;
}
async function saveFile(name,data,mime="text/csv"){
  const cl=await claude();
  if(cl.downloads){try{await cl.downloads.save({filename:name,data:new Blob([data],{type:mime})});toast("Arquivo salvo");return}catch(err){if(err&&err.code==="declined")return}}
  // Fora do Claude (navegador comum / VS Code Live Server): download nativo.
  if(!window.claude){const url=URL.createObjectURL(new Blob([data],{type:mime}));const a=document.createElement("a");a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast("Arquivo baixado");return}
  const card=document.createElement("section");card.className="card";card.style.marginTop="18px";
  card.innerHTML=`<div class="card-h"><div><h3>Copiar dados</h3><p>Não deu para salvar o arquivo aqui. Copie e cole no Excel, Google Planilhas ou num arquivo de texto.</p></div><button class="btn sm quiet" data-close>${icon("x")}</button></div><textarea id="cp${uid()}" rows="8" style="font-family:var(--mono);font-size:.78rem" readonly aria-label="Dados"></textarea><div><button class="btn primary">Copiar</button></div>`;
  app.appendChild(card);const ta=$("textarea",card);ta.value=data.replace(/^﻿/,"");card.scrollIntoView({behavior:"smooth"});
  $(".btn.primary",card).onclick=()=>{(navigator.clipboard?navigator.clipboard.writeText(ta.value):Promise.reject()).then(()=>toast("Copiado")).catch(()=>{ta.focus();ta.select()})};$("[data-close]",card).onclick=()=>card.remove();
}

/* ================= dica flutuante ================= */
const tip=$("#tip");
document.addEventListener("pointerover",ev=>{const t=ev.target.closest&&ev.target.closest("[data-tip]");if(!t||!t.dataset.tip){tip.hidden=true;return}tip.textContent=t.dataset.tip;tip.hidden=false;place(ev)});
document.addEventListener("pointermove",ev=>{if(!tip.hidden)place(ev)});
document.addEventListener("scroll",()=>tip.hidden=true,true);
function place(ev){const w=tip.offsetWidth,h=tip.offsetHeight;let x=ev.clientX+14,y=ev.clientY-h-12;if(x+w>innerWidth-8)x=ev.clientX-w-14;if(y<8)y=ev.clientY+18;tip.style.left=Math.max(8,x)+"px";tip.style.top=y+"px"}

if(!db.active&&db.experiments[0])db.active=db.experiments[0].id;
render();claude();
})();
