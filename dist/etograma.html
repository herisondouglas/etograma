<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Etograma de Campo</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400..700&family=Albert+Sans:wght@400;500;600;700&family=JetBrains+Mono:wght@500;600&display=swap">
<style>
/* Layout: plataforma de pesquisa. Desktop = barra lateral fixa + área de trabalho de 1120px;
   celular = barra superior com seletor de experimento + barra de abas inferior para uso no curral. */
/* Linguagem visual: tinta quase preta sobre branco, um único laranja vivo como acento, linhas finas,
   tipografia grotesca grande e leve, rótulos em caixa alta espaçada, cantos de 8–12px.
   Laranja só como preenchimento (contraste com texto escuro); texto em laranja usa --accent-text (≥ 4,5:1). */
:root{
  --bg:#ffffff; --surface:#ffffff; --surface-2:#f3f3f2; --ink:#080d10; --ink-2:#464b4e; --muted:#6c7174; --line:#e7e7e6; --line-2:#d3d4d4;
  --accent:#ff7a00; --accent-2:#fff0e2; --accent-ink:#080d10; --accent-text:#a84a00;
  --night:#080d10; --night-2:#1a2024; --on-night:#fffefd; --on-night-2:rgba(255,254,253,.62);
  --hay:#a84a00; --now:#fff0e2; --rare:#7b4fa0; --rare-2:#f1e9f7;
  --good:#18794a; --good-2:#e2f3e8; --warn:#a86a00; --warn-2:#fbefd6; --bad:#bf3429; --bad-2:#fbe6e3;
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#d9363e;
  --div-neg:#2a78d6; --div-pos:#eb6834; --div-mid:#eceee9;
  --display:"Bricolage Grotesque","Trebuchet MS",system-ui,sans-serif;
  --body:"Albert Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  --r:12px; --r-sm:8px;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#080d10; --surface:#0f1518; --surface-2:#172024; --ink:#f3f2ef; --ink-2:#b9bcbd; --muted:#8a8f92; --line:#20282c; --line-2:#2c363a;
  --accent:#ff8a1f; --accent-2:#2b1a09; --accent-ink:#080d10; --accent-text:#ffa04d;
  --night:#04070a; --night-2:#141a1e; --on-night:#fffefd; --on-night-2:rgba(255,254,253,.62);
  --hay:#ffa04d; --now:#2b1a09; --rare:#c39be3; --rare-2:#291f34;
  --good:#4cc47f; --good-2:#16301f; --warn:#f0a830; --warn-2:#33270f; --bad:#f0766b; --bad-2:#3a1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#ef5b62;
  --div-neg:#3987e5; --div-pos:#d95926; --div-mid:#222b25; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#080d10; --surface:#0f1518; --surface-2:#172024; --ink:#f3f2ef; --ink-2:#b9bcbd; --muted:#8a8f92; --line:#20282c; --line-2:#2c363a;
  --accent:#ff8a1f; --accent-2:#2b1a09; --accent-ink:#080d10; --accent-text:#ffa04d;
  --night:#04070a; --night-2:#141a1e; --on-night:#fffefd; --on-night-2:rgba(255,254,253,.62);
  --hay:#ffa04d; --now:#2b1a09; --rare:#c39be3; --rare-2:#291f34;
  --good:#4cc47f; --good-2:#16301f; --warn:#f0a830; --warn-2:#33270f; --bad:#f0766b; --bad-2:#3a1a17;
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#ef5b62;
  --div-neg:#3987e5; --div-pos:#d95926; --div-mid:#222b25; color-scheme:dark}

*{box-sizing:border-box}
html,body{background:var(--bg);color:var(--ink)}
body{font-family:var(--body);font-size:15.5px;line-height:1.5;-webkit-font-smoothing:antialiased}
h1,h2,h3,h4{font-family:var(--display);font-weight:500;letter-spacing:-.02em;margin:0;line-height:1.05;text-wrap:balance}
h1{font-size:clamp(2.1rem,5.2vw,3.3rem);letter-spacing:-.035em}
h2{font-size:1.6rem;letter-spacing:-.025em}
h3{font-size:1.14rem;font-weight:600;letter-spacing:-.01em}
p{margin:0}
a{color:var(--accent-text)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px;border-radius:6px}
.num{font-family:var(--mono);font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.tnum{font-variant-numeric:tabular-nums}
.muted{color:var(--muted)}
.ink2{color:var(--ink-2)}
.eyebrow{font-family:var(--display);font-size:.74rem;text-transform:uppercase;letter-spacing:.16em;font-weight:600;color:var(--muted)}
.stack{display:flex;flex-direction:column;gap:12px}
.stack-lg{display:flex;flex-direction:column;gap:22px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.spread{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:space-between}
.grow{flex:1;min-width:0}

/* ---------- casca ---------- */
.shell{display:grid;grid-template-columns:1fr;min-height:100%}
.side{display:none}
.topbar{position:sticky;top:0;z-index:30;background:var(--night);color:var(--on-night);padding:calc(10px + env(safe-area-inset-top,0px)) 16px 10px;display:flex;gap:10px;align-items:center}
.brand{display:flex;align-items:center;gap:9px;font-family:var(--display);font-weight:600;font-size:1.2rem;letter-spacing:-.03em;white-space:nowrap}
.mark{width:28px;height:28px;border-radius:6px;background:var(--accent);display:grid;place-items:center;flex:none}
.mark svg{width:18px;height:18px;stroke:var(--accent-ink);fill:none;stroke-width:2.2;stroke-linecap:round}
.expsel{flex:1;min-width:0;display:flex;justify-content:flex-end}
.expsel select{max-width:100%;min-height:38px;border:0;background:var(--night-2);color:var(--on-night);border-radius:var(--r-sm);padding:6px 32px 6px 12px;font-weight:600;font-size:.86rem;text-overflow:ellipsis}
.expsel select:focus{box-shadow:0 0 0 2px var(--accent)}
.iconbtn{width:40px;height:40px;border-radius:var(--r-sm);border:0;background:var(--night-2);color:var(--on-night);display:grid;place-items:center;flex:none}
.iconbtn svg{width:19px;height:19px}
main{padding:20px 16px 110px;max-width:1120px;width:100%;margin:0 auto;min-width:0}
.tabbar{position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);display:grid;grid-template-columns:repeat(6,1fr);padding:6px 2px calc(6px + env(safe-area-inset-bottom,0px))}
.tabbar button{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 0;font-size:.64rem;font-weight:600;color:var(--muted);border-radius:10px;min-height:52px}
.tabbar button svg{width:22px;height:22px}
.tabbar button[aria-current=page]{color:var(--ink)}
.tabbar button[aria-current=page] .pip{background:var(--accent);color:var(--accent-ink)}
.pip{padding:3px 12px;border-radius:var(--r-sm);display:grid;place-items:center}
svg.i{fill:none;stroke:currentColor;stroke-width:1.9;stroke-linecap:round;stroke-linejoin:round}
@media (min-width:960px){
  .shell{grid-template-columns:248px minmax(0,1fr)}
  .side{display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;padding:24px 16px;background:var(--night);color:var(--on-night)}
  .topbar,.tabbar{display:none}
  main{padding:34px 40px 60px}
  .side nav{display:flex;flex-direction:column;gap:2px}
  .side nav button{display:flex;align-items:center;gap:12px;border:0;background:transparent;padding:10px 12px;border-radius:var(--r-sm);font-family:var(--display);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;color:var(--on-night-2);text-align:left;position:relative}
  .side nav button svg{width:20px;height:20px}
  .side nav button:hover{color:var(--on-night);background:var(--night-2)}
  .side nav button[aria-current=page]{background:var(--night-2);color:var(--on-night)}
  .side nav button[aria-current=page]::before{content:"";position:absolute;left:0;top:10px;bottom:10px;width:3px;border-radius:2px;background:var(--accent)}
  .side .eyebrow{color:var(--on-night-2)}
  .side .expbox{display:flex;flex-direction:column;gap:6px}
  .side .expbox select{border:0;background:var(--night-2);color:var(--on-night);border-radius:var(--r-sm);padding:9px 10px;font-weight:600;min-height:42px;width:100%}
  .side .foot{margin-top:auto;display:flex;flex-direction:column;gap:2px}
}

/* ---------- elementos ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;border:1px solid var(--line-2);background:var(--surface);color:var(--ink);border-radius:var(--r-sm);padding:9px 18px;font-family:var(--display);font-weight:600;font-size:.78rem;text-transform:uppercase;letter-spacing:.12em;min-height:44px;white-space:nowrap;transition:background .15s,border-color .15s,transform .1s}
.btn:hover{border-color:var(--ink-2)}
.btn:active{transform:scale(.98)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.06);border-color:var(--accent)}
.btn.quiet{border-color:transparent;background:transparent;color:var(--accent-text);padding-inline:10px}
.btn.danger{color:var(--bad)}
.btn.sm{min-height:36px;padding:6px 14px;font-size:.72rem}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.btn svg{width:18px;height:18px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:flex;flex-direction:column;gap:16px;min-width:0}
.card.flat{background:var(--surface-2);border-color:transparent}
.card-h{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;flex-wrap:wrap}
.card-h p{color:var(--muted);font-size:.9rem;margin-top:4px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:760px){.g4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.kpi{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-weight:500;font-size:2.2rem;letter-spacing:-.04em;line-height:1.05}
.kpi .v small{font-family:var(--body);font-size:.8rem;font-weight:600;color:var(--muted);margin-left:4px;letter-spacing:0}
.kpi .l{font-family:var(--display);font-size:.7rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:600}
.grid.g4:has(> .kpi){gap:1px;background:var(--line);border:1px solid var(--line);border-radius:var(--r);overflow:hidden}
.grid.g4 > .kpi{border:0;border-radius:0;padding:18px 20px}
.pill{display:inline-flex;align-items:center;gap:6px;font-size:.76rem;font-weight:700;padding:3px 10px 3px 8px;border-radius:99px;white-space:nowrap}
.pill svg{width:13px;height:13px}
.pill.good{background:var(--good-2);color:var(--good)}
.pill.warn{background:var(--warn-2);color:var(--warn)}
.pill.bad{background:var(--bad-2);color:var(--bad)}
.pill.neutral{background:var(--surface-2);color:var(--ink-2)}
.tag{display:inline-block;font-size:.68rem;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--now);color:var(--ink);text-transform:uppercase;letter-spacing:.07em;vertical-align:middle}
.dot{width:10px;height:10px;border-radius:3px;display:inline-block;flex:none}
.list{display:flex;flex-direction:column;border:1px solid var(--line);border-radius:var(--r);background:var(--surface);overflow:hidden}
.item{display:flex;gap:14px;align-items:center;padding:14px 18px;border-top:1px solid var(--line);flex-wrap:wrap}
.item:first-child{border-top:0}
.item .title{font-weight:700}
.item .sub{font-size:.86rem;color:var(--muted)}
.empty{padding:28px 20px;color:var(--muted);text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center}
.progress{height:6px;border-radius:99px;background:var(--surface-2);overflow:hidden}
.progress span{display:block;height:100%;background:var(--ink);border-radius:99px}
.note{font-size:.84rem;color:var(--muted)}
.callout{display:flex;gap:12px;padding:14px 16px;border-radius:var(--r-sm);background:var(--surface-2);font-size:.9rem;color:var(--ink-2)}
.callout svg{width:20px;height:20px;flex:none;margin-top:1px}
.callout.bad{background:var(--bad-2);color:var(--ink)}
.callout.bad svg{stroke:var(--bad)}
.seg{display:inline-flex;background:var(--surface-2);border-radius:99px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;border-radius:99px;padding:7px 14px;font-weight:600;font-size:.86rem;color:var(--ink-2);min-height:36px}
.seg button[aria-pressed=true]{background:var(--surface);color:var(--ink);box-shadow:0 1px 2px rgba(0,0,0,.08)}

/* página */
.page-h{display:flex;flex-direction:column;gap:10px;margin-bottom:26px}
.page-h .row{margin-top:6px}
.crumb{display:inline-flex;align-items:center;gap:6px;border:0;background:transparent;color:var(--muted);font-family:var(--display);font-weight:600;padding:4px 0;font-size:.72rem;text-transform:uppercase;letter-spacing:.14em;align-self:flex-start}
.crumb:hover{color:var(--ink)}

/* hero do experimento */
.hero{border-radius:var(--r);padding:28px 24px;background:var(--night);color:var(--on-night);border:1px solid var(--line);display:flex;flex-direction:column;gap:18px;position:relative;overflow:hidden}
.hero .eyebrow{color:var(--on-night-2)}
.hero h1{color:inherit}
.hero .facts{display:flex;gap:28px;flex-wrap:wrap}
.hero .facts div,.hero .fact{display:flex;flex-direction:column}
.hero .fact{border:0;background:transparent;color:inherit;padding:0;text-align:left;font:inherit}
.hero .fact:hover span{color:var(--on-night)}
.hero .facts{border-top:1px solid var(--night-2);padding-top:18px}
.hero .facts b{font-family:var(--display);font-size:1.6rem;font-weight:500;letter-spacing:-.03em;line-height:1.1}
.hero .facts span,.hero .fact span{font-size:.7rem;color:var(--on-night-2);font-weight:600;text-transform:uppercase;letter-spacing:.14em;margin-top:4px}
.hero canvas{position:absolute;inset:0;width:100%;height:100%;opacity:.16;pointer-events:none}
.hero > *:not(canvas){position:relative}
.hero .btn{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
.hero .btn.ghost{background:var(--night-2);color:var(--on-night);border-color:transparent}
.hero .btn.ghost:hover{border-color:var(--on-night-2)}

/* formulários */
.form{display:grid;gap:16px}
.fields{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr));gap:14px}
label.f{display:flex;flex-direction:column;gap:6px;font-weight:600;font-size:.86rem;color:var(--ink-2);min-width:0}
.hint{font-weight:400;color:var(--muted);font-size:.8rem}
input[type=text],input[type=search],input[type=number],input[type=date],input[type=time],select,textarea{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:10px 12px;min-height:44px;width:100%;color:var(--ink)}
input:focus,select:focus,textarea:focus{border-color:var(--ink);outline:none;box-shadow:0 0 0 3px var(--accent-2)}
.checks{display:flex;flex-wrap:wrap;gap:8px}
.check{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line-2);border-radius:var(--r-sm);padding:7px 14px 7px 10px;font-weight:600;font-size:.9rem;cursor:pointer;background:var(--surface)}
.check input{accent-color:var(--ink);width:18px;height:18px}
.check:has(input:checked){border-color:var(--ink);background:var(--accent-2)}

/* tabelas */
.tablebox{overflow:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:.9rem;font-variant-numeric:tabular-nums}
.t th{font-family:var(--display);font-size:.68rem;text-transform:uppercase;letter-spacing:.14em;color:var(--muted);font-weight:700;text-align:left;padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface);position:sticky;top:0}
.t td{padding:10px 14px;border-bottom:1px solid var(--line);white-space:nowrap}
.t tr:last-child td{border-bottom:0}
.t td.r,.t th.r{text-align:right}
.t input{min-height:38px;padding:6px 10px;max-width:120px}

/* observação */
.species{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
@media (min-width:700px){.species{grid-template-columns:repeat(4,minmax(0,1fr))}}
.sp{border:1px solid var(--line);background:var(--surface);border-radius:var(--r);padding:18px;text-align:left;display:flex;flex-direction:column;gap:4px;min-height:120px;transition:border-color .15s,transform .1s}
.sp:hover{border-color:var(--ink)}
.sp:active{transform:scale(.98)}
.sp .gl{width:38px;height:38px;border-radius:var(--r-sm);background:var(--night);color:var(--accent);display:grid;place-items:center;font-family:var(--display);font-weight:600;font-size:1.2rem;margin-bottom:auto}
.sp .name{font-family:var(--display);font-weight:500;font-size:1.4rem;letter-spacing:-.025em;margin-top:14px}
.sp .meta{font-size:.82rem;color:var(--muted)}
.now{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px}
.clock{font-family:var(--mono);font-weight:500;font-size:3rem;line-height:1;letter-spacing:-.04em}
.countdown{font-weight:700;font-size:.92rem}
.countdown.due{color:var(--hay)}
.tabs{display:flex;gap:6px;overflow-x:auto;padding-bottom:2px}
.tab{border:1px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:8px 16px;font-weight:700;white-space:nowrap;min-height:40px}
.tab[aria-selected=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:8px}
.chip{border:1.5px solid var(--line-2);background:var(--surface);border-radius:var(--r-sm);padding:12px;font-weight:600;text-align:left;min-height:56px;display:flex;align-items:center;gap:10px;line-height:1.2;transition:background .12s,border-color .12s}
.chip .box{flex:none;width:22px;height:22px;border-radius:4px;border:1.5px solid var(--line-2);display:grid;place-items:center;font-family:var(--mono);font-size:.9rem;font-weight:600}
.chip[aria-pressed=true]{border-color:var(--ink);background:var(--accent-2)}
.chip[aria-pressed=true] .box{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chip.rare[aria-pressed=true]{border-color:var(--rare);background:var(--rare-2)}
.chip.rare[aria-pressed=true] .box{background:var(--rare);border-color:var(--rare);color:var(--surface)}
.sub-h{font-family:var(--display);font-size:.72rem;text-transform:uppercase;letter-spacing:.15em;color:var(--muted);font-weight:600}
.sheetbox{overflow:auto;max-height:68vh;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table.sheet{border-collapse:separate;border-spacing:0;font-size:.88rem;width:max-content;min-width:100%}
.sheet th,.sheet td{border-bottom:1px solid var(--line);border-right:1px solid var(--line);padding:0;text-align:center}
.sheet thead th{position:sticky;top:0;background:var(--surface);z-index:3;font-weight:700;font-size:.7rem;line-height:1.15;padding:8px 4px;width:64px;min-width:64px;vertical-align:bottom;color:var(--ink-2)}
.sheet thead th.rare{color:var(--rare)}
.sheet th.time{position:sticky;left:0;z-index:2;background:var(--surface);font-family:var(--mono);font-size:.9rem;font-weight:600;width:66px;min-width:66px;padding:0 6px}
.sheet thead th.time{z-index:4;font-family:var(--body);font-size:.7rem}
.sheet td.cell button{width:100%;height:38px;border:0;background:transparent;font-family:var(--mono);font-weight:600;font-size:1rem;color:var(--ink)}
.sheet td.cell.rare{background:var(--rare-2)}
.sheet td.cell.rare button{color:var(--rare)}
.sheet td.cell.on{background:var(--accent-2)}
.sheet td.obs{min-width:190px;padding:0 4px}
.sheet td.obs input{border:0;background:transparent;min-height:36px;padding:6px;width:100%;box-shadow:none}
.sheet tr.isnow th.time,.sheet tr.isnow td{background:var(--now)}
.sheet tr.isnow th.time{color:var(--hay);box-shadow:inset 3px 0 0 var(--accent)}
.sheet tr.day td{background:var(--surface-2);text-align:left;padding:6px 12px;font-weight:700;font-size:.76rem;color:var(--muted)}

/* gráficos */
.viz{width:100%;overflow-x:auto}
.viz svg{display:block;max-width:100%;height:auto;overflow:visible}
.viz text{font-family:var(--body);fill:var(--muted);font-size:11px}
.viz .lbl{fill:var(--ink-2);font-size:12px;font-weight:600}
.viz .val{fill:var(--ink);font-size:11.5px;font-weight:600;font-family:var(--mono)}
.viz .grid line{stroke:var(--line);stroke-width:1}
.viz .axis{stroke:var(--line-2);stroke-width:1}
.viz [data-tip]{cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:.84rem;color:var(--ink-2);font-weight:600}
.legend span{display:inline-flex;align-items:center;gap:7px}
.tip{position:fixed;z-index:60;pointer-events:none;background:var(--ink);color:var(--bg);padding:7px 10px;border-radius:8px;font-size:.8rem;font-weight:600;max-width:260px;line-height:1.35;white-space:pre-line}
.statline{display:flex;gap:22px;flex-wrap:wrap}
.statline div{display:flex;flex-direction:column}
.statline b{font-family:var(--mono);font-size:1.2rem;font-weight:500}
.statline span{font-family:var(--display);font-size:.7rem;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.14em}
.verdict{border-radius:var(--r-sm);padding:14px 16px;font-size:.95rem;line-height:1.5;background:var(--surface-2)}
.verdict.sig{background:var(--good-2)}
.verdict b{font-weight:700}
.ai-out{white-space:pre-wrap;font-size:.95rem;line-height:1.6;background:var(--surface-2);border-radius:var(--r-sm);padding:16px;min-height:60px}

/* visão IA */
.frames{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr));gap:12px}
.frame{border:1px solid var(--line);border-radius:12px;overflow:hidden;background:var(--surface);display:flex;flex-direction:column}
.frame img{width:100%;aspect-ratio:16/10;object-fit:cover;display:block;background:var(--surface-2);max-width:100%}
.frame .fb{padding:10px 12px;display:flex;flex-direction:column;gap:6px;font-size:.86rem}
.frame .fb .t{font-family:var(--mono);font-weight:600}
.mini{display:inline-block;font-size:.76rem;font-weight:700;padding:2px 8px;border-radius:4px;background:var(--accent-2);color:var(--accent-text);margin:0 4px 4px 0}
.drop{border:1.5px dashed var(--line-2);border-radius:var(--r);padding:26px;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;background:var(--surface)}
.drop.over{border-color:var(--ink);background:var(--accent-2)}
.toast{position:fixed;left:50%;bottom:calc(84px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--night);color:var(--on-night);padding:12px 18px;border-radius:var(--r-sm);border-left:3px solid var(--accent);font-weight:600;z-index:70;max-width:calc(100% - 32px);text-align:center}
@media (min-width:960px){.toast{bottom:28px}}
.beh{display:grid;grid-template-columns:minmax(0,1fr) 150px 44px;gap:8px;align-items:center}
@media (max-width:520px){.beh{grid-template-columns:minmax(0,1fr) 110px 40px}}
.spin{width:16px;height:16px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
.anlist{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:8px 18px}
.anb{display:flex;align-items:center;gap:8px;min-width:0}
.anb .dot,.gdot{border-radius:50%}
.savebar{display:flex;gap:12px;align-items:center;flex-wrap:wrap;margin:12px 16px 0;padding:12px 16px;border-radius:var(--r-sm);background:var(--bad-2);color:var(--ink);font-size:.9rem}
.savebar svg{width:20px;height:20px;stroke:var(--bad);flex:none}
.savebar span{flex:1;min-width:220px}
@media (min-width:960px){.savebar{margin:20px 40px 0}}
.legend svg.i{width:15px;height:15px}
.anlist .beh{grid-template-columns:minmax(0,1fr) 132px 40px}
.item.link{width:100%;background:transparent;border:0;border-top:1px solid var(--line);text-align:left;font:inherit;color:inherit;cursor:pointer;flex-wrap:nowrap}
.item.link:first-child{border-top:0}
.item.link:hover{background:var(--surface-2)}
.list.out .item{opacity:.72}
.page-h h1 .pill{vertical-align:middle;font-family:var(--body);letter-spacing:0}
.item .chev{width:18px;height:18px;flex:none;transform:scaleX(-1);color:var(--muted)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(76px,1fr));gap:8px}
.bchip{--c:var(--line-2);border:1.5px solid var(--c);background:color-mix(in srgb,var(--c) 14%,var(--surface));border-radius:var(--r-sm);padding:8px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;min-height:58px;color:var(--ink);min-width:0}
.bchip b{font-family:var(--mono);font-size:1.2rem;font-weight:600;line-height:1.1}
.bchip small{font-size:.68rem;font-weight:600;color:var(--ink-2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.bchip.none{border-style:dashed;background:var(--surface);color:var(--muted)}
.bchip.none small{color:var(--accent-text)}
.nextb{margin-top:-4px}
.nextb .btn .dot{margin-left:-2px}
/* sincronização */
.syncchip{display:flex;align-items:center;gap:9px;border:0;background:var(--night-2);color:var(--on-night-2);border-radius:var(--r-sm);padding:9px 12px;font-size:.76rem;font-weight:600;text-align:left;margin-bottom:8px;line-height:1.3}
.syncchip .sdot,.syncdot{width:9px;height:9px;border-radius:50%;background:var(--muted);flex:none;display:inline-block}
.iconbtn.syncchip{position:relative;padding:0;margin:0;width:40px;justify-content:center}
.iconbtn.syncchip .sdot{position:absolute;right:6px;top:6px;border:2px solid var(--night)}
[data-st=ok] .sdot,.syncdot[data-st=ok]{background:var(--good)}
[data-st=syncing] .sdot,[data-st=loading] .sdot,.syncdot[data-st=syncing]{background:var(--accent);animation:pulse 1.2s ease-in-out infinite}
[data-st=offline] .sdot,.syncdot[data-st=offline]{background:var(--warn)}
[data-st=error] .sdot,.syncdot[data-st=error]{background:var(--bad)}
@keyframes pulse{50%{opacity:.35}}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.card.cloud{grid-column:1/-1}
.callout .syncdot{margin-top:6px}

<div id="root"></div>
<script>
/* ===== Estatística (funções puras) ===== */
const Stats=(function(){
  function lgamma(x){const c=[76.18009172947146,-86.50532032941677,24.01409824083091,-1.231739572450155,0.1208650973866179e-2,-0.5395239384953e-5];let y=x,t=x+5.5;t-=(x+0.5)*Math.log(t);let s=1.000000000190015;for(let j=0;j<6;j++)s+=c[j]/++y;return -t+Math.log(2.5066282746310005*s/x)}
  function betacf(a,b,x){const MAXIT=300,EPS=3e-14,FPMIN=1e-300;let qab=a+b,qap=a+1,qam=a-1,c=1,d=1-qab*x/qap;if(Math.abs(d)<FPMIN)d=FPMIN;d=1/d;let h=d;for(let m=1;m<=MAXIT;m++){const m2=2*m;let aa=m*(b-m)*x/((qam+m2)*(a+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;h*=d*c;aa=-(a+m)*(qab+m)*x/((a+m2)*(qap+m2));d=1+aa*d;if(Math.abs(d)<FPMIN)d=FPMIN;c=1+aa/c;if(Math.abs(c)<FPMIN)c=FPMIN;d=1/d;const del=d*c;h*=del;if(Math.abs(del-1)<EPS)break}return h}
  function ibeta(x,a,b){if(x<=0)return 0;if(x>=1)return 1;const bt=Math.exp(lgamma(a+b)-lgamma(a)-lgamma(b)+a*Math.log(x)+b*Math.log(1-x));return x<(a+1)/(a+b+2)?bt*betacf(a,b,x)/a:1-bt*betacf(b,a,1-x)/b}
  const pT=(t,df)=>df>0&&isFinite(t)?ibeta(df/(df+t*t),df/2,.5):NaN;          // bicaudal
  const pF=(F,d1,d2)=>(d1>0&&d2>0&&isFinite(F))?ibeta(d2/(d2+d1*F),d2/2,d1/2):NaN;
  const mean=a=>a.reduce((s,v)=>s+v,0)/a.length;
  const sd=a=>{if(a.length<2)return NaN;const m=mean(a);return Math.sqrt(a.reduce((s,v)=>s+(v-m)**2,0)/(a.length-1))};
  const se=a=>sd(a)/Math.sqrt(a.length);
  function pearson(xs,ys){
    const P=xs.map((x,i)=>[x,ys[i]]).filter(([x,y])=>isFinite(x)&&isFinite(y));const n=P.length;
    if(n<3)return{n,r:NaN,p:NaN};
    const mx=mean(P.map(p=>p[0])),my=mean(P.map(p=>p[1]));let sxy=0,sxx=0,syy=0;
    for(const[x,y]of P){sxy+=(x-mx)*(y-my);sxx+=(x-mx)**2;syy+=(y-my)**2}
    if(!sxx||!syy)return{n,r:NaN,p:NaN};
    const r=sxy/Math.sqrt(sxx*syy),b=sxy/sxx,a=my-b*mx,df=n-2;
    const t=Math.abs(r)>=1?Infinity:r*Math.sqrt(df/(1-r*r));
    return{n,r,r2:r*r,p:isFinite(t)?pT(t,df):0,a,b,df,t};
  }
  function anova(groups){ // groups: [{nome, vals:[]}]
    const G=groups.map(g=>({...g,vals:g.vals.filter(v=>isFinite(v))})).filter(g=>g.vals.length);
    const all=G.flatMap(g=>g.vals),N=all.length,k=G.length;
    const desc=G.map(g=>({nome:g.nome,n:g.vals.length,media:mean(g.vals),dp:sd(g.vals),ep:se(g.vals)}));
    if(k<2||N-k<1)return{desc,k,N,F:NaN,p:NaN};
    const gm=mean(all);let ssb=0,ssw=0;
    for(const g of G){const m=mean(g.vals);ssb+=g.vals.length*(m-gm)**2;for(const v of g.vals)ssw+=(v-m)**2}
    const dfb=k-1,dfw=N-k,msb=ssb/dfb,msw=ssw/dfw,F=msw>0?msb/msw:Infinity;
    const p=isFinite(F)?pF(F,dfb,dfw):0;
    // comparações par a par: t usando QM do resíduo, Bonferroni
    const pares=[];const m=k*(k-1)/2;
    for(let i=0;i<k;i++)for(let j=i+1;j<k;j++){const a=G[i],b=G[j];const t=(mean(a.vals)-mean(b.vals))/Math.sqrt(msw*(1/a.vals.length+1/b.vals.length));const pr=Math.min(1,pT(Math.abs(t),dfw)*m);pares.push({a:a.nome,b:b.nome,dif:mean(a.vals)-mean(b.vals),p:pr})}
    return{desc,k,N,ssb,ssw,dfb,dfw,msb,msw,F,p,pares,cv:100*Math.sqrt(msw)/gm};
  }
  // Benjamini-Hochberg: corrige p para muitas comparações ao mesmo tempo (devolve q na mesma ordem; NaN fica NaN).
  function bh(ps){
    const idx=ps.map((p,i)=>[p,i]).filter(([p])=>isFinite(p)).sort((a,b)=>a[0]-b[0]);const m=idx.length,q=ps.map(()=>NaN);
    let min=1;for(let k=m-1;k>=0;k--){min=Math.min(min,idx[k][0]*m/(k+1));q[idx[k][1]]=min}
    return q;
  }
  function niceTicks(min,max,count){
    if(!isFinite(min)||!isFinite(max))return[0,1];
    if(min===max){const d=Math.abs(min)||1;min-=d*.1;max+=d*.1}
    const span=max-min,step0=span/Math.max(1,count),mag=Math.pow(10,Math.floor(Math.log10(step0))),f=step0/mag;
    const step=(f<1.5?1:f<3?2:f<7?5:10)*mag;const lo=Math.floor(min/step)*step,hi=Math.ceil(max/step)*step;
    const out=[];for(let v=lo;v<=hi+step/2;v+=step)out.push(+v.toFixed(10));return out;
  }
  return{lgamma,ibeta,pT,pF,mean,sd,se,pearson,anova,bh,niceTicks};
})();
if(typeof module!=="undefined")module.exports=Stats;

</script>
<script>
/* ===== Dados: cálculos de desempenho, comportamento e CSV (funções puras, testadas em tests/data.test.js) ===== */
const Data=(function(){
  const S=typeof Stats!=="undefined"?Stats:require("./stats.js");
  const uid=()=>Math.random().toString(36).slice(2,9);
  const pad=n=>String(n).padStart(2,"0");
  const hhmm=d=>pad(d.getHours())+":"+pad(d.getMinutes());
  const dmy=d=>pad(d.getDate())+"/"+pad(d.getMonth()+1)+"/"+d.getFullYear();
  const parseDay=s=>{const[y,m,d]=String(s).split("-").map(Number);return new Date(y,m-1,d)};
  const dayDiff=(a,b)=>Math.round((parseDay(b)-parseDay(a))/864e5);
  const norm=s=>String(s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/\s+/g," ").trim();
  const grupo=(e,gid)=>e.grupos.find(g=>g.id===gid);

  /* ---------- animais ---------- */
  // Identificação principal: número da baia (rotulo "Baia") ou brinco. Se faltar uma, usa a outra.
  const porBaia=e=>e.rotulo==="Baia";
  // Animal que saiu do experimento (morte, descarte…) tem a.saida = { data, motivo, obs? }: fica no histórico, fora das análises.
  const ativo=a=>!a.saida;
  const ident=(e,a)=>String((porBaia(e)?(a.baia||a.brinco):(a.brinco||a.baia))||"");
  // "1-12, 15" → ["1",…,"12","15"]. Intervalos só com números inteiros (até 500 de uma vez).
  function parseIds(txt){const out=[];
    for(const part of String(txt||"").split(/[,;\n]+/).map(x=>x.trim()).filter(Boolean)){
      const m=part.match(/^(\d+)\s*(?:-|a|até)\s*(\d+)$/i);
      if(m&&+m[2]>=+m[1]&&+m[2]-+m[1]<=500){const w=m[1].length>1&&m[1][0]==="0"?m[1].length:0;for(let i=+m[1];i<=+m[2];i++)out.push(w?String(i).padStart(w,"0"):String(i))}
      else out.push(part)}
    return out}
  // Atualiza dados de versões antigas: antes, em experimentos por baia, o número da baia ficava no campo "brinco".
  function migrate(d){
    for(const e of d.experiments||[])if(porBaia(e))for(const a of e.animais||[])if(a.baia==null){a.baia=a.brinco;a.brinco=""}
    return d}
  // Idade em meses a partir da data de nascimento (AAAA-MM-DD).
  function ageMonths(nasc,ref=new Date()){if(!nasc)return NaN;const d=parseDay(nasc);if(!isFinite(d))return NaN;
    return (ref.getFullYear()-d.getFullYear())*12+(ref.getMonth()-d.getMonth())-(ref.getDate()<d.getDate()?1:0)}

  /* ---------- desempenho ---------- */
  // GMD = inclinação da reta peso × dias (mínimos quadrados). Com 2 pesagens é igual a (final − inicial) ÷ dias.
  function gmdOf(pts,d0){
    const P=pts.map(p=>({x:dayDiff(d0,p.d),y:p.w}));const mx=S.mean(P.map(p=>p.x)),my=S.mean(P.map(p=>p.y));
    let sxy=0,sxx=0;for(const p of P){sxy+=(p.x-mx)*(p.y-my);sxx+=(p.x-mx)**2}
    return sxx>0?sxy/sxx:NaN;
  }
  function performance(e){
    const pes=[...e.pesagens].sort((a,b)=>a.data<b.data?-1:1);
    return e.animais.map(a=>{
      const pts=pes.filter(p=>isFinite(p.pesos[a.id])).map(p=>({d:p.data,w:+p.pesos[a.id]}));
      const g=grupo(e,a.grupoId)||{};const o={id:a.id,ident:ident(e,a),brinco:a.brinco,baia:a.baia,grupoId:a.grupoId,grupo:g.nome||"—",meta:+g.gmdMeta,pts};
      if(pts.length){o.p0=pts[0].w;o.pf=pts[pts.length-1].w}
      if(pts.length>=2){o.dias=dayDiff(pts[0].d,pts[pts.length-1].d);o.gmd=o.dias>0?gmdOf(pts,pts[0].d):NaN}
      const cs=e.consumo.map(c=>+c.valores[a.id]).filter(isFinite);o.cms=cs.length?S.mean(cs):NaN;
      o.ca=isFinite(o.cms)&&o.gmd>0?o.cms/o.gmd:NaN;
      o.pv=isFinite(o.cms)&&isFinite(o.p0)?100*o.cms/((o.p0+o.pf)/2):NaN;
      if(isFinite(o.gmd)&&o.meta>0){o.ratio=o.gmd/o.meta;o.status=o.ratio>=1.1?"acima":o.ratio>=.9?"ok":"abaixo"}else o.status="sem";
      if(a.saida){o.saida=a.saida;o.status="saiu"}
      return o;});
  }

  /* ---------- comportamento ---------- */
  function sessionAnimalId(e,s,k){
    if(s.animalIds&&s.animalIds[k]&&e.animais.some(a=>a.id===s.animalIds[k]))return s.animalIds[k];
    // pelo nome salvo na observação ("Baia 7", "07"…): primeiro pela identificação principal, depois pela outra
    const n=norm(s.animais[k]),hit=k=>k&&(n===k||n.endsWith(" "+k));
    // animais ativos têm preferência (a baia de um animal que saiu pode ter sido reocupada)
    const pool=[...e.animais.filter(ativo),...e.animais.filter(a=>!ativo(a))];
    const a=pool.find(a=>hit(norm(ident(e,a))))||pool.find(a=>hit(norm(a.brinco))||hit(norm(a.baia)));return a?a.id:null;
  }
  // min/dia = (marcações do comportamento ÷ horários marcados) × 1440
  function behaviorVars(e,sessions){
    const acc={},names={};
    sessions.filter(s=>s.expId===e.id).forEach(s=>{
      s.animais.forEach((_,k)=>{const aid=sessionAnimalId(e,s,k);if(!aid)return;
        const M=s.marks[k]||{};const A=acc[aid]=acc[aid]||{obs:0,c:{}};
        for(const i in M){const arr=M[i];if(!arr||!arr.length)continue;A.obs++;
          for(const cid of arr){const c=s.comp.find(x=>x.id===cid);if(!c)continue;const key="b:"+norm(c.nome);names[key]=c.nome;A.c[key]=(A.c[key]||0)+1}}
      });});
    const vars=Object.keys(names).map(k=>({key:k,nome:names[k]+" (min/dia)",curto:names[k],comp:true}));
    const by={};for(const aid in acc){by[aid]={};for(const v of vars)by[aid][v.key]=acc[aid].obs?(acc[aid].c[v.key]||0)/acc[aid].obs*1440:NaN;by[aid]._obs=acc[aid].obs}
    return{vars,by};
  }
  function dataset(e,sessions){
    const P=performance(e),BV=behaviorVars(e,sessions);
    const base=[{key:"p0",nome:"Peso inicial (kg)"},{key:"pf",nome:"Peso atual (kg)"},{key:"gmd",nome:"GMD (kg/dia)"},{key:"cms",nome:"Consumo de MS (kg/dia)"},{key:"ca",nome:"Conversão alimentar (kg MS/kg)"}];
    // quem saiu do experimento não entra na estatística
    const rows=P.filter(p=>!p.saida).map(p=>({id:p.id,ident:p.ident,brinco:p.brinco,baia:p.baia,grupoId:p.grupoId,grupo:p.grupo,v:{p0:p.p0,pf:p.pf,gmd:p.gmd,cms:p.cms,ca:p.ca,...(BV.by[p.id]||{})}}));
    const vars=[...base,...BV.vars].filter(v=>rows.filter(r=>isFinite(r.v[v.key])).length>=3);
    return{rows,vars,perf:P,saidas:P.length-rows.length};
  }

  /* ---------- observações ---------- */
  const nSlots=s=>Math.round(s.duracao*60/s.intervalo);
  const slotDate=(s,i)=>new Date(s.inicio+i*s.intervalo*60000);
  const marked=(s,a,i)=>(s.marks[a]&&s.marks[a][i])||[];
  // Mesma observação = mesmo observador, mesmos animais, mesmo início e intervalo (evita duplicar ao importar 2 vezes).
  const sessionSignature=s=>[norm(s.observador),s.animais.map(norm).join(","),s.inicio,s.intervalo].join("|");

  /* ---------- CSV ---------- */
  // Texto que começa com = + - @ vira fórmula no Excel: prefixa com apóstrofo (o Excel esconde o apóstrofo).
  const FORMULA=/^[=+\-@\t\r]/;
  function toCSV(rows){return"﻿"+rows.map(r=>r.map(v=>{if(typeof v==="number")v=isFinite(v)?String(+v.toFixed(4)).replace(".",","):"";v=String(v??"");if(FORMULA.test(v))v="'"+v;return/[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v}).join(";")).join("\r\n")}
  function sessionCSV(s){const head=["Experimento","Espécie","Observador","Animal","Data","Hora","Intervalo (min)",...s.comp.map(c=>c.nome),"Observação"];const rows=[head];
    s.animais.forEach((n,a)=>{for(let i=0;i<nSlots(s);i++){const d=slotDate(s,i),mk=marked(s,a,i);rows.push([s.nome,s.especie,s.observador,n,dmy(d),hhmm(d),String(s.intervalo),...s.comp.map(c=>mk.includes(c.id)?"1":"0"),(s.obs[a]||{})[i]||""])}});return toCSV(rows)}
  function parseCSV(txt){txt=txt.replace(/^﻿/,"");
    const firstLine=txt.slice(0,txt.indexOf("\n")>=0?txt.indexOf("\n"):txt.length);
    const sep=firstLine.includes(";")?";":firstLine.includes("\t")?"\t":",";
    const rows=[];let row=[],f="",q=false;for(let i=0;i<txt.length;i++){const ch=txt[i];
      if(q){if(ch==='"'){if(txt[i+1]==='"'){f+='"';i++}else q=false}else f+=ch}

  // Aceita 10/10/2026, 10/10/26 e 2026-10-10 (o Excel às vezes muda o formato ao salvar).

    const comp=compNames.map(n=>{const ref=sp?.comp.find(c=>norm(c.nome)===norm(n));return{id:uid(),nome:n,tipo:ref?.tipo||"comum"}});
    const groups={};R.slice(1).forEach(r=>{const k=(r[iE]||"")+"|"+(r[iO]||"");(groups[k]=groups[k]||[]).push(r)});
    const out=[];
    for(const k in groups){const rows=groups[k];const animais=[...new Set(rows.map(r=>r[iA]))];
      const ts=rows.map(r=>toTs(r[iD],r[iH]));const t0=Math.min(...ts),tEnd=Math.max(...ts);
      const a0=rows.filter(r=>r[iA]===animais[0]).map(r=>toTs(r[iD],r[iH])).sort((a,b)=>a-b);
      const intervalo=iI>=0&&+rows[0][iI]?+rows[0][iI]:(a0.length>1?Math.round((a0[1]-a0[0])/60000):5);

<script>
/* ===== Sincronização com o Supabase =====
   O app continua salvando primeiro no aparelho (funciona sem internet). Este módulo:
   • converte o db local em linhas das tabelas (toRows) e de volta (applyRows);
   • push: envia só o que mudou desde a última sincronização (comparando com a "sombra" do que já está no banco);
   • pull: busca o que mudou no banco desde a última vez e aplica aqui, sem passar por cima de alteração local ainda não enviada.
   Funções puras + cliente do Supabase injetado → testado em tests/sync.test.js com um banco falso. */
const Sync=(function(){
  const TABLES=["experiments","treatments","animals","weighings","intakes","sessions"];
  const CHILD=["treatments","animals","weighings","intakes","sessions"];
  const nn=v=>v===undefined||v===""?null:v;
  // JSON com chaves em ordem: o banco (jsonb) reordena chaves, então a comparação não pode depender da ordem
  const stable=v=>v===null||typeof v!=="object"?JSON.stringify(v):Array.isArray(v)?"["+v.map(stable).join(",")+"]":"{"+Object.keys(v).filter(k=>v[k]!==undefined).sort().map(k=>JSON.stringify(k)+":"+stable(v[k])).join(",")+"}";
  const setOpt=(o,k,v)=>{if(v===null||v===undefined||v==="")delete o[k];else o[k]=v};
  const key=(t,id)=>t+":"+id;

  /* ---------- local → linhas ---------- */
  function toRows(db){
    const out=Object.fromEntries(TABLES.map(t=>[t,[]]));
    const exps=db.experiments.filter(e=>!e.exemplo),ids=new Set(exps.map(e=>e.id));
    for(const e of exps){
      out.experiments.push({id:e.id,nome:e.nome||"Experimento",especie_id:nn(e.especieId),especie:nn(e.especie),responsavel:nn(e.responsavel),inicio:nn(e.inicio),rotulo:e.rotulo==="Animal"?"Animal":"Baia"});
      (e.grupos||[]).forEach((g,i)=>out.treatments.push({id:g.id,experiment_id:e.id,nome:g.nome||"Tratamento",dieta:nn(g.dieta),gmd_meta:g.gmdMeta!==""&&g.gmdMeta!=null&&isFinite(+g.gmdMeta)?+g.gmdMeta:null,cor:nn(g.cor),ordem:i}));
      for(const a of e.animais||[])out.animals.push({id:a.id,experiment_id:e.id,treatment_id:nn(a.grupoId),baia:nn(a.baia),brinco:nn(a.brinco),raca:nn(a.raca),sexo:nn(a.sexo),nascimento:nn(a.nascimento),obs:nn(a.obs),saida:a.saida||null});
      for(const p of e.pesagens||[])out.weighings.push({id:p.id,experiment_id:e.id,data:p.data,pesos:p.pesos||{}});
      for(const c of e.consumo||[])out.intakes.push({id:c.id,experiment_id:e.id,data:c.data,valores:c.valores||{}});
    }
    for(const s of db.sessions){if(s.exemplo||(s.expId&&!ids.has(s.expId)))continue; // exemplo nunca vai para o banco
      out.sessions.push({id:s.id,experiment_id:s.expId||null,nome:nn(s.nome),especie:nn(s.especie),observador:nn(s.observador),comp:s.comp||[],animais:s.animais||[],animal_ids:s.animalIds||null,inicio:+s.inicio,intervalo:+s.intervalo,duracao:+s.duracao,marks:s.marks||{},obs:s.obs||{}})}
    return out;
  }
  // { "tabela:id": JSON estável da linha }
  function rowMap(db){const m={},R=toRows(db);for(const t of TABLES)for(const r of R[t])m[key(t,r.id)]=stable(r);return m}

  /* ---------- linhas → local ---------- */
  // Aplica linhas vindas do banco. skip(t,id) = true mantém a versão local (alteração ainda não enviada).
  function applyRows(db,rows,skip=()=>false){
    const findExp=id=>db.experiments.find(e=>e.id===id);
    for(const r of rows.experiments||[]){if(skip("experiments",r.id)&&!r.deleted)continue;let e=findExp(r.id);
      if(r.deleted){if(e){db.experiments=db.experiments.filter(x=>x!==e);db.sessions=db.sessions.filter(s=>s.expId!==r.id);if(db.active===r.id)db.active=db.experiments[0]?.id||null}continue}
      if(!e){e={id:r.id,grupos:[],animais:[],pesagens:[],consumo:[]};db.experiments.push(e);if(!db.active)db.active=e.id}
      e.nome=r.nome;e.rotulo=r.rotulo||"Baia";setOpt(e,"especieId",r.especie_id);setOpt(e,"especie",r.especie);setOpt(e,"responsavel",r.responsavel);setOpt(e,"inicio",r.inicio);setOpt(e,"codigo",r.codigo)}
    const ordem={};
    const child=(t,list,build)=>{for(const r of rows[t]||[]){const e=findExp(r.experiment_id);if(!e||(skip(t,r.id)&&!r.deleted))continue;
      const arr=e[list],i=arr.findIndex(x=>x.id===r.id);
      if(r.deleted){if(i>=0)arr.splice(i,1);continue}
      const o=i>=0?arr[i]:{id:r.id};build(o,r);if(i<0)arr.push(o)}};
    child("treatments","grupos",(g,r)=>{g.nome=r.nome;setOpt(g,"dieta",r.dieta);setOpt(g,"cor",r.cor);if(r.gmd_meta==null)delete g.gmdMeta;else g.gmdMeta=+r.gmd_meta;ordem[r.id]=+r.ordem||0});
    child("animals","animais",(a,r)=>{a.grupoId=r.treatment_id;a.baia=r.baia??"";a.brinco=r.brinco??"";for(const k of ["raca","sexo","nascimento","obs","saida"])setOpt(a,k,r[k])});
    child("weighings","pesagens",(p,r)=>{p.data=r.data;p.pesos=r.pesos||{}});
    child("intakes","consumo",(c,r)=>{c.data=r.data;c.valores=r.valores||{}});
    for(const e of db.experiments)if(e.grupos.some(g=>g.id in ordem))e.grupos=e.grupos.map((g,i)=>[g,g.id in ordem?ordem[g.id]:i]).sort((x,y)=>x[1]-y[1]).map(x=>x[0]);
    for(const r of rows.sessions||[]){if(skip("sessions",r.id)&&!r.deleted)continue;const i=db.sessions.findIndex(s=>s.id===r.id);
      if(r.deleted){if(i>=0)db.sessions.splice(i,1);continue}
      if(r.experiment_id&&!findExp(r.experiment_id))continue;
      const s=i>=0?db.sessions[i]:{id:r.id};
      Object.assign(s,{expId:r.experiment_id||null,nome:r.nome||"Observação",especie:r.especie||"",observador:r.observador||"",comp:r.comp||[],animais:r.animais||[],animalIds:r.animal_ids||null,inicio:+r.inicio,intervalo:+r.intervalo,duracao:+r.duracao,marks:r.marks||{},obs:r.obs||{}});
      if(i<0)db.sessions.push(s)}
    return db;
  }

  /* ---------- rede ---------- */
  const isNetwork=err=>!!err&&!err.code&&/fetch|network|load failed|timeout|offline/i.test(String(err.message||err));
  const fail=err=>{const e=new Error(err.message||String(err));e.network=isNetwork(err);e.code=err.code;throw e};
  async function fetchAll(client,t,{since,experimentId,ids}={}){
    const out=[];for(let from=0;;from+=1000){
      let q=client.from(t).select("*");
      if(since)q=q.gt("updated_at",since);
      if(experimentId)q=t==="experiments"?q.eq("id",experimentId):q.eq("experiment_id",experimentId);
      if(ids)q=q.in("id",ids);
      const{data,error}=await q.order("updated_at").range(from,from+999);
      if(error)fail(error);out.push(...data);if(data.length<1000)return out}
  }

  // Envia as alterações locais. shadow é atualizado no lugar. Devolve { enviados, erros, refetch }.
  async function push(client,db,shadow){
    const R=toRows(db),now={};for(const t of TABLES)for(const r of R[t])now[key(t,r.id)]=stable(r);
    let enviados=0;const erros=[],refetch={};
    const noted=(t,id,err)=>{erros.push({tabela:t,id,mensagem:err.message||String(err)});(refetch[t]=refetch[t]||[]).push(id)};
    // 1) inserir / atualizar, na ordem das dependências
    for(const t of TABLES){const ch=R[t].filter(r=>shadow[key(t,r.id)]!==now[key(t,r.id)]);
      for(let i=0;i<ch.length;i+=200){const b=ch.slice(i,i+200);const{error}=await client.from(t).upsert(b,{onConflict:"id"});
        if(!error){b.forEach(r=>shadow[key(t,r.id)]=now[key(t,r.id)]);enviados+=b.length;continue}
        if(isNetwork(error))fail(error);
        for(const r of b){const{error:e2}=await client.from(t).upsert([r],{onConflict:"id"}); // um por um para achar o que falhou
          if(!e2){shadow[key(t,r.id)]=now[key(t,r.id)];enviados++}else{if(isNetwork(e2))fail(e2);shadow[key(t,r.id)]=now[key(t,r.id)];noted(t,r.id,e2)}}}}
    // 2) exclusões: estava no banco e sumiu daqui. Experimento apagado leva junto o que é dele (não precisa apagar filho por filho).
    const gone=t=>Object.keys(shadow).filter(k=>k.startsWith(t+":")&&!(k in now)).map(k=>({id:k.slice(t.length+1),row:JSON.parse(shadow[k])}));
    const expGone=new Set(gone("experiments").map(x=>x.id));
    for(const t of ["experiments",...CHILD]){
      const list=gone(t);if(t!=="experiments")for(const x of list.filter(x=>expGone.has(x.row.experiment_id)))delete shadow[key(t,x.id)];
      const ids=list.filter(x=>t==="experiments"||!expGone.has(x.row.experiment_id)).map(x=>x.id);
      for(let i=0;i<ids.length;i+=200){const b=ids.slice(i,i+200);const{error}=await client.from(t).update({deleted:true}).in("id",b);
        if(!error){b.forEach(id=>delete shadow[key(t,id)]);enviados+=b.length;continue}
        if(isNetwork(error))fail(error);
        for(const id of b){const{error:e2}=await client.from(t).update({deleted:true}).in("id",[id]);
          if(!e2){delete shadow[key(t,id)];enviados++}else{if(isNetwork(e2))fail(e2);delete shadow[key(t,id)];noted(t,id,e2)}}}}
    return{enviados,erros,refetch};
  }

  // Busca o que mudou no banco e aplica. Devolve { changed: Set("tabela:id"), lastPull }.
  async function pull(client,db,shadow,{since=null,experimentId=null,ids=null}={}){
    const got={};let max=since;
    for(const t of TABLES){if(ids&&!ids[t]){got[t]=[];continue}
      got[t]=await fetchAll(client,t,{since,experimentId,ids:ids?ids[t]:null});
      for(const r of got[t])if(r.updated_at&&(!max||r.updated_at>max))max=r.updated_at}
    const before=rowMap(db),codes=()=>Object.fromEntries(db.experiments.map(e=>[e.id,e.codigo])),codesBefore=codes();
    // alteração local ainda não enviada (ou criada durante a sincronização) não é sobrescrita
    const pending=(t,id)=>{const k=key(t,id);return k in before&&before[k]!==shadow[k]};
    applyRows(db,got,pending);
    const after=rowMap(db),changed=new Set();
    for(const k of new Set([...Object.keys(before),...Object.keys(after)]))if(before[k]!==after[k])changed.add(k);
    // o código de convite vem só do banco (não é enviado), mas também precisa ser guardado e mostrado
    const codesAfter=codes();for(const id in codesAfter)if(codesAfter[id]!==codesBefore[id])changed.add(key("experiments",id));
    for(const t of TABLES)for(const r of got[t]){const k=key(t,r.id);if(pending(t,r.id)&&!r.deleted)continue;
      if(k in after)shadow[k]=after[k];else delete shadow[k]}
    return{changed,lastPull:max};
  }

  // Quantas alterações locais ainda não foram para o banco
  function pendingCount(db,shadow){const now=rowMap(db);let n=0;for(const k in now)if(shadow[k]!==now[k])n++;for(const k in shadow)if(!(k in now))n++;return n}
  // Remove do aparelho o que veio do banco (ao sair da conta). O exemplo e o que nunca foi sincronizado ficam.
  function forget(db,shadow){
    const exps=new Set(Object.keys(shadow).filter(k=>k.startsWith("experiments:")).map(k=>k.slice(12)));
    const sess=new Set(Object.keys(shadow).filter(k=>k.startsWith("sessions:")).map(k=>k.slice(9)));
    db.experiments=db.experiments.filter(e=>!exps.has(e.id));
    db.sessions=db.sessions.filter(s=>!sess.has(s.id)&&!exps.has(s.expId));
    if(!db.experiments.some(e=>e.id===db.active))db.active=db.experiments[0]?.id||null;return db}

  // Valida a chave: nunca aceitar a service_role/secret (daria acesso total ao banco a qualquer um com o app)
  function checkKey(k){k=String(k||"").trim();
    if(/^sb_secret_/i.test(k))return"Essa é a chave secreta. Use a chave pública (anon / publishable).";
    if(/^sb_publishable_/i.test(k))return null;
    const p=k.split(".");if(p.length!==3)return"Chave inválida. Copie a chave pública (anon / publishable) em Project Settings → API.";
    try{const b=p[1].replace(/-/g,"+").replace(/_/g,"/");const json=typeof atob==="function"?atob(b+"===".slice((b.length+3)%4)):Buffer.from(b,"base64").toString();
      const role=JSON.parse(json).role;if(role==="service_role")return"Essa é a chave service_role (secreta). Use a chave pública (anon).";if(role!=="anon")return"Chave inválida: use a chave pública (anon / publishable).";}
    catch(e){return"Chave inválida. Copie a chave pública (anon / publishable)."}
    return null}
  const checkUrl=u=>/^https:\/\/[a-z0-9-]+\.supabase\.(co|in)\/?$/i.test(String(u||"").trim())||/^https?:\/\/(localhost|127\.0\.0\.1)(:\d+)?\/?$/i.test(String(u||"").trim())?null:"Endereço inválido. Ex.: https://abcdefgh.supabase.co";

  return{TABLES,stable,toRows,rowMap,applyRows,push,pull,pendingCount,forget,isNetwork,checkKey,checkUrl};
})();
if(typeof module!=="undefined")module.exports=Sync;

</script>

]}

/* Exemplo realista: confinamento com 12 vacas em 2 dietas, 3 pesagens, consumo e 24 h de etograma */
function exampleData(species){
  const r=rng(20261010);const sp=species.find(s=>s.id==="vaca")||species[0];
  const today=new Date();today.setHours(0,0,0,0);const start=new Date(today);start.setDate(start.getDate()-56);
  // gA = dieta 80% (mais concentrado: come menos tempo, rumina menos, ganha mais); gB = dieta 40%
  const gA={id:"gA",nome:"Dieta 80%",dieta:"80% de concentrado",gmdMeta:1.4,cor:"vermelho"},gB={id:"gB",nome:"Dieta 40%",dieta:"40% de concentrado",gmdMeta:1.0,cor:"azul"};
  const animais=[];for(let i=1;i<=12;i++){const n=new Date(today);n.setMonth(n.getMonth()-(22+i%4));animais.push({id:"a"+i,baia:String(i),brinco:String(4100+i*13),grupoId:ladoCurral(i)==="V"?"gA":"gB",raca:"Nelore",sexo:"Macho",nascimento:isoDay(n)})}
  const truth={};
  animais.forEach(a=>{const A=a.grupoId==="gA";
    const eat=(A?215:265)+gauss(r)*22,rum=(A?395:505)+gauss(r)*35;
    let gmd=(A?1.46:1.03)+gauss(r)*.09-.0015*(rum-(A?395:505))+.001*(eat-(A?215:265));
    if(a.id==="a5")gmd=1.08; if(a.id==="a8")gmd=.74;
    truth[a.id]={eat,rum,gmd,p0:Math.round(372+gauss(r)*18),cms:(A?10.6:9.7)+gauss(r)*.55};});
  const dates=[0,28,56].map(d=>{const x=new Date(start);x.setDate(x.getDate()+d);return isoDay(x)});
  const pesagens=dates.map((d,k)=>({id:uid(),data:d,pesos:Object.fromEntries(animais.map(a=>{const t=truth[a.id];return[a.id,Math.round((t.p0+t.gmd*k*28+gauss(r)*2.5)*2)/2]}))}));
  const consumo=dates.slice(1).map(d=>({id:uid(),data:d,valores:Object.fromEntries(animais.map(a=>[a.id,Math.round((truth[a.id].cms+gauss(r)*.25)*10)/10]))}));
  const exp={id:"exemplo",exemplo:true,exemploV:4,nome:"Confinamento Nelore",especieId:sp.id,especie:sp.nome,responsavel:"Raquel",inicio:dates[0],rotulo:"Baia",grupos:[gB,gA],animais,pesagens,consumo};
  // etograma 24 h, 6 observadores × 2 animais
  const sessStart=new Date(start);sessStart.setDate(sessStart.getDate()+50);sessStart.setHours(7,0,0,0);
  const comp=sp.comp.map(c=>({...c}));const id=n=>comp.find(c=>c.nome.startsWith(n))?.id;
  const sessions=[];
  for(let o=0;o<6;o++){
    const pair=[animais[o*2],animais[o*2+1]];
    const s={id:uid(),exemplo:true,expId:exp.id,nome:"Etograma 24 h · dia 50",especie:sp.nome,comp,observador:"Observador "+(o+1),animais:pair.map(a=>"Baia "+a.baia),animalIds:pair.map(a=>a.id),inicio:sessStart.getTime(),intervalo:5,duracao:24,marks:{},obs:{}};
    pair.forEach((a,k)=>{const t=truth[a.id];const pE=t.eat/1440,pR=t.rum/1440,pW=.022,pI=Math.max(.05,1-pE-pR-pW);
      s.marks[k]={};s.obs[k]={};let st="Ócio";
      for(let i=0;i<288;i++){const h=(7+i*5/60)%24;
        let wE=pE*((h>=7&&h<9.5)||(h>=15&&h<17.5)?3.2:h<5||h>21?.35:1),wR=pR*(h<6||h>20?1.5:.85),wW=pW,wI=pI;
        if(r()>.72){const tot=wE+wR+wW+wI,x=r()*tot;st=x<wE?"Comendo":x<wE+wR?"Ruminando":x<wE+wR+wW?"Bebendo água":"Ócio"}
        const lying=(st==="Ruminando"||st==="Ócio")&&r()<(h<6||h>20?.75:.45);
        const m=[id(st),id(lying?"Deitada":"Em pé")];
        if(r()<.035)m.push(id("Defecando"));if(r()<.028)m.push(id("Urinando"));if(r()<.008)m.push(id("Se coçando"));
        s.marks[k][i]=m.filter(Boolean);}
    });
    sessions.push(s);
  }
  sessions[2].obs[1][40]="Se esfregou no cocho";
  return{exp,sessions};
}

  rowsData.forEach((row,ri)=>{const y=ri*(rh+gap);s+=`<text class="lbl" x="${lw-10}" y="${y+rh/2+4}" text-anchor="end">${esc(row.label)}</text><rect x="${lw}" y="${y}" width="${W-lw}" height="${rh}" rx="4" fill="var(--surface-2)"/>`;
    let i=0;while(i<row.slots.length){const c=row.slots[i];let j=i;while(j+1<row.slots.length&&row.slots[j+1]===c)j++;
      if(c>=0){const b=BAND_COLORS[c];s+=`<rect x="${lw+i*cwd}" y="${y}" width="${(j-i+1)*cwd}" height="${rh}" fill="${b[1]}" data-tip="${esc(row.label)} · ${b[2]}\n${row.time(i)}–${row.time(j+1)} (${fmtDur((j-i+1)*interval)})"/>`}
      i=j+1;}});
  const yb=rowsData.length*(rh+gap)+12;
  for(let h=0;h<=24;h+=W<520?6:3){const x=lw+h*60/interval*cwd;s+=`<text x="${Math.min(x,W-14)}" y="${yb+4}" text-anchor="middle">${rowsData[0].time(h*60/interval)}</text>`}
  return s+"</svg>";
}

function ethogramCard(e){
  const sess=db.sessions.filter(s=>s.expId===e.id&&s.comp.some(c=>BAND_COLORS.some(b=>b[0]===norm(c.nome))));
  if(!sess.length)return"";
  const latestDay=Math.max(...sess.map(s=>parseDay(isoDay(new Date(s.inicio))).getTime()));
  const S=sess.filter(s=>parseDay(isoDay(new Date(s.inicio))).getTime()===latestDay);
  const rows=[];
  S.forEach(s=>s.animais.forEach((nm,k)=>{const M=s.marks[k]||{};const n=Math.round(s.duracao*60/s.intervalo);const slots=[];
    for(let i=0;i<n;i++){const arr=(M[i]||[]).map(cid=>norm((s.comp.find(c=>c.id===cid)||{}).nome));slots.push(BAND_COLORS.findIndex(b=>arr.includes(b[0])))}
    const aid=sessionAnimalId(e,s,k);const a=e.animais.find(x=>x.id===aid);
    rows.push({label:a?shortName(e,a):nm,g:a?gIndex(e,a.grupoId):99,slots,time:i=>hhmm(new Date(s.inicio+i*s.intervalo*60000))});}));
  rows.sort((a,b)=>a.g-b.g||a.label.localeCompare(b.label,undefined,{numeric:true}));
  const iv=S[0].intervalo;
  return`<section class="card" style="margin-top:16px">
    <div class="card-h"><div><h3>Orçamento de tempo · 24 h</h3><p>Cada faixa é um animal; cada traço, uma marcação de ${iv} min. Registro de ${dmy(new Date(S[0].inicio))}.</p></div><button class="btn sm" id="toObs">Abrir registros</button></div>
    <div class="viz">${bands(rows.slice(0,16),iv)}</div>
    <div class="legend">${BAND_COLORS.map(b=>`<span><i class="dot" style="background:${b[1]}"></i>${b[2]}</span>`).join("")}<span><i class="dot" style="background:var(--surface-2);border:1px solid var(--line-2)"></i>Outro / sem marcação</span></div>
  </section>`;
}

    $("#bGrid",app).addEventListener("click",ev=>{const b=ev.target.closest("[data-b]");if(!b)return;const G=groups(),k=+b.dataset.b,i=G.findIndex(g=>g.id===asg[k]);asg[k]=G[(i+1)%G.length].id;paintGrid()})}
  $("#addG",app).onclick=()=>{const used=groups().map(g=>g.cor);addG({id:uid(),nome:"Dieta "+String.fromCharCode(65+gs.children.length),dieta:"",gmdMeta:1,cor:(CORES.find(k=>!used.includes(k[0]))||CORES[0])[0]});refresh()};
  if(ed){$("#toAn",app).onclick=()=>{db.active=ed.id;go({name:"animals"})};
    $("#delX",app).onclick=ev=>{const b=ev.currentTarget;if(!b.dataset.armed){b.dataset.armed=1;b.textContent=Cloud.user&&ed.codigo?"Confirmar: apagar experimento e seus registros (também no banco, para todos)?":"Confirmar: apagar experimento e seus registros?";return}
      db.experiments=db.experiments.filter(x=>x!==ed);db.sessions=db.sessions.filter(s=>s.expId!==ed.id);db.active=db.experiments[0]?.id||null;save();toast("Experimento apagado");go({name:"dash"})}}
  $("#f",app).onsubmit=ev=>{ev.preventDefault();
    const sp=db.species.find(s=>s.id===$("#xSp",app).value);
    const G=$$("[data-gid]",gs).map(c=>({id:c.dataset.gid,nome:$('[data-k="nome"]',c).value.trim()||"Tratamento",dieta:$('[data-k="dieta"]',c).value.trim(),gmdMeta:parseFloat(String($('[data-k="gmdMeta"]',c).value).replace(",","."))||0,cor:$('[data-k="cor"]',c).value}));
    const data={nome:$("#xNome",app).value.trim()||"Experimento",especieId:sp.id,especie:sp.nome,responsavel:$("#xResp",app).value.trim(),inicio:$("#xIni",app).value,rotulo:$("#xRot",app).value,grupos:G};
    if(ed){Object.assign(ed,data);save();toast("Experimento salvo");go({name:"dash"})}
    else{const x={id:uid(),...data,animais:[],pesagens:[],consumo:[]};
      // já cria Baia 1…N (um animal por baia), divididas entre as dietas; tudo pode ser corrigido na aba Animais
      const nb=data.rotulo==="Baia"?asg.length:0;
      if(nb){const falta=asg.map((g,k)=>g?null:k+1).filter(Boolean);
        if(falta.length){toast(`Escolha a dieta da(s) baia(s) ${falta.join(", ")}`);$("#bCard",app).scrollIntoView({behavior:"smooth",block:"center"});return}}
      for(let i=1;i<=nb;i++)x.animais.push({id:uid(),baia:String(i),brinco:"",grupoId:asg[i-1]});
      db.experiments.push(x);db.active=x.id;save();toast(nb?`Experimento criado com ${nb} baias. Confira a dieta de cada uma.`:"Experimento criado. Agora cadastre os animais.");go({name:"animals"})}
  };
};

/* ================= ANIMAIS (cadastro) ================= */
const RACAS={vaca:["Nelore","Angus","Brangus","Senepol","Tabapuã","Guzerá","Gir","Girolando","Holandesa","Jersey","Brahman","Mestiço"],
  cavalo:["Mangalarga Marchador","Quarto de Milha","Crioulo","Árabe","Puro-Sangue Inglês","Campolina","Sem raça definida"],
  ovelha:["Santa Inês","Dorper","Texel","Morada Nova","Suffolk","Lacaune","Sem raça definida"],
  galinha:["Caipira","Embrapa 051","Isa Brown","Hy-Line","Cobb","Ross"],
  porco:["Comercial (híbrido)","Large White","Landrace","Duroc","Pietrain","Moura","Piau"]};
const SEXOS=["Macho","Fêmea","Macho castrado"];
// Próximo número de baia livre (depois do maior número usado por um animal ativo).
const nextBaia=e=>String(Math.max(0,...ativos(e).map(a=>parseInt(a.baia,10)).filter(isFinite))+1);
const sortAnimals=e=>[...e.animais].sort((a,b)=>idOf(e,a).localeCompare(idOf(e,b),undefined,{numeric:true}));
const fmtIdade=m=>!isFinite(m)||m<0?"":m<24?`${m} ${m===1?"mês":"meses"}`:`${Math.floor(m/12)} anos${m%12?` e ${m%12} m`:""}`;
// Mantém o nome mostrado nas observações igual ao cadastro (ex.: depois de corrigir o número da baia).
function syncSessionNames(e,a){db.sessions.forEach(s=>{if(s.expId!==e.id||!s.animalIds)return;const k=s.animalIds.indexOf(a.id);if(k>=0)s.animais[k]=shortName(e,a)})}
function removeAnimal(e,a){e.animais=e.animais.filter(x=>x!==a);e.pesagens.forEach(p=>delete p.pesos[a.id]);e.consumo.forEach(c=>delete c.valores[a.id])}

};

function saidaCard(a){
  if(a.saida)return`<section class="card" style="margin-top:22px"><div class="callout">${icon("info")}<span><b>Saiu do experimento em ${dmy(parseDay(a.saida.data))}</b> · ${esc(a.saida.motivo)}${a.saida.obs?`: ${esc(a.saida.obs)}`:""}. Continua no histórico, mas não entra nas médias, nos alertas nem na estatística.</span></div>
    <div><button type="button" class="btn sm quiet" id="undoSaida">Desfazer saída (voltar ao experimento)</button></div></section>`;
  return`<section class="card" style="margin-top:22px"><div class="card-h"><div><h3>Saída do experimento</h3><p>Morte, descarte, doença… O animal sai das médias, dos alertas e da estatística, mas as pesagens e observações dele ficam guardadas.</p></div><button type="button" class="btn sm" id="openSaida">Registrar saída</button></div>
    <div id="saidaBox" class="stack" hidden><div class="fields">
      <label class="f">Data da saída<input type="date" id="sData" value="${isoDay(new Date())}" max="${isoDay(new Date())}"></label>
      <label class="f">Motivo<select id="sMot">${MOTIVOS.map(m=>`<option>${m}</option>`).join("")}</select></label>
      <label class="f">Detalhe <span class="hint">opcional</span><input type="text" id="sObs" placeholder="Ex.: timpanismo; laudo do veterinário"></label></div>
      <div class="row"><button type="button" class="btn primary" id="okSaida">Confirmar saída</button><button type="button" class="btn quiet" id="cancelSaida">Cancelar</button></div></div></section>`;
}
function wireSaida(e,a){
  const u=$("#undoSaida",app);
  if(u)u.onclick=ev=>{const b=ev.currentTarget;if(!b.dataset.armed){b.dataset.armed=1;b.textContent="Confirmar: voltar o animal ao experimento?";return}
    if(ativos(e).some(x=>norm(idOf(e,x))===norm(idOf(e,a))))return toast(`${aName(e,a)} já está ocupada por outro animal ativo`);
    delete a.saida;save();toast("Animal de volta ao experimento");render()};
  const o=$("#openSaida",app);if(!o)return;
  o.onclick=()=>{$("#saidaBox",app).hidden=false;o.hidden=true;$("#sData",app).focus()};
  $("#cancelSaida",app).onclick=()=>{$("#saidaBox",app).hidden=true;o.hidden=false};
  $("#okSaida",app).onclick=()=>{const data=$("#sData",app).value;if(!data)return toast("Informe a data da saída");
    const s={data,motivo:$("#sMot",app).value};const obs=$("#sObs",app).value.trim();if(obs)s.obs=obs;
    a.saida=s;save();toast(`${aName(e,a)} saiu do experimento`);go({name:"animals"})};
}

/* ================= OBSERVAR ================= */
function currentSlot(s){const i=Math.floor((Date.now()-s.inicio)/(s.intervalo*60000));return(i>=0&&i<nSlots(s))?i:null}
function filledCount(s){let n=0;for(const a in s.marks)for(const i in s.marks[a])if(s.marks[a][i].length)n++;return n}

  <section class="stack" style="margin-bottom:22px"><h3>Observação avulsa</h3><p class="note" style="margin-top:-6px">Sem vínculo com experimento: escolha o animal.</p>

  </section>
  <section class="stack">
    <h2>Registros${e?` · ${esc(e.nome)}`:""}</h2>
    ${list(mine)||`<div class="list"><div class="empty">Nenhuma observação neste experimento ainda.</div></div>`}
    ${loose.length?`<h3 style="margin-top:10px">Avulsas</h3>${list(loose)}`:""}
    <p class="note">Os registros ficam salvos neste aparelho. Para juntar o trabalho de vários observadores, cada um exporta a planilha e você importa em Ajustes.</p>

VIEWS.setup=function(){
  const e=view.exp!==false?exp():null;

VIEWS.sheet=function(){
  const s=db.sessions.find(x=>x.id===view.id);if(!s)return go({name:"obsHome"});
  const a=Math.min(view.animal||0,s.animais.length-1);
  const comuns=s.comp.filter(c=>c.tipo!=="raro"),raros=s.comp.filter(c=>c.tipo==="raro"),cols=[...comuns,...raros];
  const cur=currentSlot(s);const focus=view.slot!=null?view.slot:(cur!=null?cur:0);
  const e=s.expId?db.experiments.find(x=>x.id===s.expId):null;
  app.innerHTML=pageHead(`${esc(s.especie)} · ${esc(s.observador||"sem observador")} · a cada ${s.intervalo} min`,esc(s.nome),e?`Experimento ${esc(e.nome)}`:"",`<button class="btn sm" id="sum">Resumo</button><button class="btn sm" id="exp">${icon("down")}Exportar planilha</button><button class="btn sm" id="vis">${icon("eye")}Preencher com IA</button>`,"Observar")+`
  <div class="stack-lg">
  <div class="tabs" role="tablist">${s.animais.map((n,i)=>`<button class="tab" role="tab" aria-selected="${i===a}" data-a="${i}">${esc(n)}</button>`).join("")}</div>
  <section class="now" aria-live="polite">
    <div class="spread">
      <div><div class="sub-h" id="slotLabel"></div><div class="clock" id="slotTime"></div></div>
      <div class="stack" style="align-items:flex-end;gap:8px"><div class="countdown" id="cd"></div>
        <div class="row"><button class="btn sm" id="prev" aria-label="Horário anterior">${icon("back")}</button><button class="btn sm" id="goNow">Agora</button><button class="btn sm" id="next" aria-label="Próximo horário"><svg class="i" viewBox="0 0 24 24" style="transform:scaleX(-1)">${IC.back}</svg></button></div></div>
    </div>
    <div class="sub-h">O que ${esc(s.animais[a])} está fazendo?</div>
    <div class="chips" id="chips"></div>
    <input type="text" id="obsNow" placeholder="Observação deste horário (opcional)" aria-label="Observação deste horário">
    <p class="note">Deixe esta tela aberta: ela não apaga sozinha, mas se você trocar de app ou bloquear o celular, o aviso de vibração do próximo horário não toca.</p>
  </section>
  <section class="stack">
    <div class="spread"><h2>Planilha · ${esc(s.animais[a])}</h2><span class="note">Toque numa célula para marcar ou desmarcar</span></div>
    <div class="sheetbox" id="sheetbox"><table class="sheet"><thead><tr><th class="time">Hora</th>${cols.map(c=>`<th class="${c.tipo==="raro"?"rare":""}" scope="col">${esc(c.nome)}</th>`).join("")}<th scope="col" style="width:auto;text-align:left;padding-left:10px">Observação</th></tr></thead><tbody id="tb"></tbody></table></div>
  </section></div>`;
  wireBack({name:"obsHome"});
  const tb=$("#tb",app);let html="",lastDay="";
  for(let i=0;i<nSlots(s);i++){const d=slotDate(s,i),day=dmy(d);
    if(day!==lastDay){html+=`<tr class="day"><td colspan="${cols.length+2}">${day}</td></tr>`;lastDay=day}
    const mk=marked(s,a,i);
    html+=`<tr data-i="${i}"${i===cur?' class="isnow"':""}><th class="time" scope="row">${hhmm(d)}</th>${cols.map(c=>{const on=mk.includes(c.id);return`<td class="cell${c.tipo==="raro"?" rare":""}${on?" on":""}"><button data-c="${c.id}" aria-label="${esc(c.nome)} às ${hhmm(d)}" aria-pressed="${on}">${on?"X":""}</button></td>`}).join("")}<td class="obs"><input type="text" data-o="${i}" value="${esc((s.obs[a]||{})[i]||"")}" aria-label="Observação às ${hhmm(d)}"></td></tr>`;}
  tb.innerHTML=html;
  function toggle(i,cid){s.marks[a]=s.marks[a]||{};const arr=s.marks[a][i]||[];s.marks[a][i]=arr.includes(cid)?arr.filter(x=>x!==cid):[...arr,cid];if(!s.marks[a][i].length)delete s.marks[a][i];save();paintRow(i);if(i===view.slot)paintChips()}
  function paintRow(i){const tr=tb.querySelector(`tr[data-i="${i}"]`);if(!tr)return;const mk=marked(s,a,i);$$("button[data-c]",tr).forEach(b=>{const on=mk.includes(b.dataset.c);b.textContent=on?"X":"";b.setAttribute("aria-pressed",on);b.parentElement.classList.toggle("on",on)})}
  function paintChips(){const i=view.slot,mk=marked(s,a,i),d=slotDate(s,i);
    $("#slotTime",app).textContent=hhmm(d);$("#slotLabel",app).textContent=(i===currentSlot(s)?"Marcação de agora":"Marcação")+` · ${i+1} de ${nSlots(s)} · ${dmy(d)}`;
    const ch=c=>{const on=mk.includes(c.id);return`<button class="chip${c.tipo==="raro"?" rare":""}" aria-pressed="${on}" data-c="${c.id}"><span class="box">${on?"X":""}</span>${esc(c.nome)}</button>`};
    $("#chips",app).innerHTML=comuns.map(ch).join("")+(raros.length?`<div class="sub-h" style="grid-column:1/-1;margin-top:4px">Fora do comum</div>`+raros.map(ch).join(""):"");
    $("#obsNow",app).value=(s.obs[a]||{})[i]||"";}
  function setSlot(i,scroll){view.slot=Math.max(0,Math.min(nSlots(s)-1,i));paintChips();
    if(scroll){const tr=tb.querySelector(`tr[data-i="${view.slot}"]`),box=$("#sheetbox",app);if(tr)box.scrollTop=tr.offsetTop-box.clientHeight/2}}
  function updateClock(){const c=currentSlot(s),el=$("#cd",app);if(!el)return;
    $$("tr.isnow",tb).forEach(r=>{if(+r.dataset.i!==c)r.classList.remove("isnow")});if(c!=null){const tr=tb.querySelector(`tr[data-i="${c}"]`);if(tr)tr.classList.add("isnow")}
    if(Date.now()<s.inicio){const ms=s.inicio-Date.now();el.textContent="Começa em "+Math.floor(ms/60000)+" min "+pad(Math.floor(ms/1000)%60)+" s";el.classList.remove("due")}
    else if(c==null){el.textContent="Período de observação encerrado";el.classList.remove("due")}
    else{const ms=s.inicio+(c+1)*s.intervalo*60000-Date.now(),done=marked(s,a,c).length>0;
      el.textContent=done?`Próxima marcação em ${Math.floor(ms/60000)}:${pad(Math.floor(ms/1000)%60)}`:`Marque o horário ${hhmm(slotDate(s,c))}`;el.classList.toggle("due",!done);
      if(lastSlot!=null&&lastSlot!==c){try{navigator.vibrate&&navigator.vibrate([200,100,200])}catch(err){}if(view.slot===lastSlot)setSlot(c,true)}lastSlot=c}}
  tb.addEventListener("click",ev=>{const b=ev.target.closest("button[data-c]");if(!b)return;const i=+b.closest("tr").dataset.i;toggle(i,b.dataset.c);if(view.slot!==i)setSlot(i,false)});
  tb.addEventListener("change",ev=>{const inp=ev.target.closest("input[data-o]");if(!inp)return;s.obs[a]=s.obs[a]||{};const v=inp.value.trim();if(v)s.obs[a][inp.dataset.o]=v;else delete s.obs[a][inp.dataset.o];save();if(+inp.dataset.o===view.slot)$("#obsNow",app).value=v});
  $("#chips",app).addEventListener("click",ev=>{const b=ev.target.closest("button[data-c]");if(b)toggle(view.slot,b.dataset.c)});
  $("#obsNow",app).addEventListener("change",ev=>{s.obs[a]=s.obs[a]||{};const v=ev.target.value.trim();if(v)s.obs[a][view.slot]=v;else delete s.obs[a][view.slot];save();const inp=tb.querySelector(`input[data-o="${view.slot}"]`);if(inp)inp.value=v});
  $("#prev",app).onclick=()=>setSlot(view.slot-1,true);$("#next",app).onclick=()=>setSlot(view.slot+1,true);
  $("#goNow",app).onclick=()=>{const c=currentSlot(s);setSlot(c!=null?c:(Date.now()<s.inicio?0:nSlots(s)-1),true)};
  $$("[data-a]",app).forEach(b=>b.onclick=()=>{view.animal=+b.dataset.a;render()});
  $("#sum",app).onclick=()=>go({name:"summary",id:s.id,animal:a});
  $("#exp",app).onclick=()=>exportSession(s);
  $("#vis",app).onclick=()=>go({name:"vision",sid:s.id,animal:a});
  setSlot(focus,true);lastSlot=null;tick=setInterval(updateClock,1000);updateClock();
  keepAwake();
};
function keepAwake(){try{if(!wake&&navigator.wakeLock&&document.visibilityState==="visible")navigator.wakeLock.request("screen").then(w=>{wake=w;w.addEventListener("release",()=>{if(wake===w)wake=null})}).catch(()=>{})}catch(err){}}
document.addEventListener("visibilitychange",()=>{if(document.visibilityState==="visible"&&view.name==="sheet"){delete view.slot;keepAwake();render()}});

VIEWS.perf=function(){
  const e=exp();if(!e){app.innerHTML=pageHead("Desempenho","Desempenho dos animais")+needExp();return wireNeedExp()}
  const P=performance(e);const ord={abaixo:0,ok:1,acima:2,sem:3,saiu:4};
  const sorted=[...P].sort((x,y)=>ord[x.status]-ord[y.status]||(x.ratio||0)-(y.ratio||0));
  const pes=[...e.pesagens].sort((a,b)=>a.data<b.data?-1:1);
  const series=e.grupos.map((g,i)=>({name:g.nome,color:gc(e,g),pts:pes.map(p=>{const v=ativos(e).filter(a=>a.grupoId===g.id).map(a=>+p.pesos[a.id]).filter(isFinite);return v.length?{x:dayDiff(e.inicio,p.data),y:Stats.mean(v)}:null}).filter(Boolean)})).filter(s=>s.pts.length);
  app.innerHTML=pageHead("Desempenho","O lote está rendendo o esperado?","GMD = inclinação da reta do peso ao longo dos dias, usando todas as pesagens (com só duas, é (peso atual − peso inicial) ÷ dias). Conversão alimentar = consumo de matéria seca ÷ GMD. Status comparado à meta de GMD de cada tratamento: abaixo de 90% é alerta.",`<button class="btn primary" id="lp">${icon("plus")}Lançar pesagem</button><button class="btn" id="lc">${icon("plus")}Lançar consumo</button><button class="btn quiet" id="ex">${icon("down")}Exportar</button>`)+`
  <div class="stack-lg">
  <div class="tablebox"><table class="t"><thead><tr><th>${rot(e)}</th><th>Tratamento</th><th class="r">Peso inicial</th><th class="r">Peso atual</th><th class="r">Dias</th><th class="r">GMD</th><th class="r">Meta</th><th>Status</th><th class="r">CMS</th><th class="r">CMS %PV</th><th class="r">CA</th></tr></thead><tbody>
  ${sorted.map(p=>`<tr><td><b>${esc(shortName(e,p))}</b></td><td><span class="row" style="gap:7px;flex-wrap:nowrap"><i class="dot" style="background:${gColor(e,p.grupoId)}"></i>${esc(p.grupo)}</span></td><td class="r num">${fmt(p.p0,1)}</td><td class="r num">${fmt(p.pf,1)}</td><td class="r num">${p.dias??"—"}</td><td class="r num"><b>${fmt(p.gmd,2)}</b></td><td class="r num">${fmt(p.meta,2)}</td><td>${statusPill(p.status)}</td><td class="r num">${fmt(p.cms,1)}</td><td class="r num">${fmt(p.pv,2)}</td><td class="r num">${fmt(p.ca,2)}</td></tr>`).join("")}
  </tbody></table></div>
  <p class="note" style="margin-top:-12px">GMD em kg/dia · CMS = consumo de matéria seca, kg/dia · CA em kg MS por kg de ganho.</p>
  <div class="grid g2">
    <section class="card"><div class="card-h"><div><h3>GMD por animal</h3><p>Barra = ganho diário; traço = meta do tratamento.</p></div></div>
      <div class="viz">${hbars(sorted.filter(p=>isFinite(p.gmd)&&!p.saida).map(p=>({label:shortName(e,p),value:p.gmd,marker:p.meta,color:gColor(e,p.grupoId),flag:p.status==="abaixo",tip:`${aName(e,p)} · ${p.grupo}\nGMD ${fmt(p.gmd,2)} kg/dia (${fmt(p.ratio*100,0)}% da meta)`})),{unit:"kg/dia",markerLabel:"Meta"})}</div>
      <div class="legend">${e.grupos.map((g,i)=>`<span><i class="dot" style="background:${gc(e,g)}"></i>${esc(g.nome)}</span>`).join("")}<span style="color:var(--bad)">${icon("arrowDown")}Abaixo da meta</span></div></section>
    <section class="card"><div class="card-h"><div><h3>Evolução do peso médio</h3><p>Média de cada tratamento em cada pesagem (kg).</p></div></div>
      ${series.length?`<div class="viz">${lines(series,"kg")}</div><div class="legend">${series.map(s=>`<span><i class="dot" style="background:${s.color}"></i>${esc(s.name)}</span>`).join("")}</div>`:`<p class="muted">Sem pesagens ainda.</p>`}</section>
  </div>
  <section class="grid g2">
    <div class="stack"><h3>Pesagens</h3><div class="list">${pes.length?pes.map(p=>`<div class="item"><div class="grow"><div class="title">${dmy(parseDay(p.data))} <span class="muted" style="font-weight:500">· dia ${dayDiff(e.inicio,p.data)}</span></div><div class="sub">${Object.values(p.pesos).filter(isFinite).length} animais pesados</div></div><button class="btn sm" data-ed="peso:${p.id}">Editar</button></div>`).join(""):`<div class="empty">Nenhuma pesagem.</div>`}</div></div>
    <div class="stack"><h3>Consumo</h3><div class="list">${e.consumo.length?[...e.consumo].sort((a,b)=>a.data<b.data?-1:1).map(c=>`<div class="item"><div class="grow"><div class="title">${dmy(parseDay(c.data))}</div><div class="sub">Média ${fmt(Stats.mean(Object.values(c.valores).filter(isFinite)),1)} kg MS/dia</div></div><button class="btn sm" data-ed="consumo:${c.id}">Editar</button></div>`).join(""):`<div class="empty">Nenhum registro de consumo.</div>`}</div></div>
  </section></div>`;
  $("#lp",app).onclick=()=>go({name:"entry",kind:"peso"});$("#lc",app).onclick=()=>go({name:"entry",kind:"consumo"});
  $("#ex",app).onclick=()=>{const D=dataset(e);saveFile(`${e.nome} - desempenho.csv`,toCSV([[rot(e),"Tratamento","Peso inicial","Peso atual","Dias","GMD","Meta GMD","Status","CMS","CMS %PV","CA","Situação"],...P.map(p=>[idOf(e,p),p.grupo,p.p0,p.pf,p.dias,p.gmd,p.meta,{acima:"Acima",ok:"No esperado",abaixo:"Abaixo",sem:"Sem dados",saiu:"Saiu"}[p.status],p.cms,p.pv,p.ca,p.saida?`Saiu em ${dmy(parseDay(p.saida.data))} (${p.saida.motivo})`:"Ativo"])]))};
  $$("[data-ed]",app).forEach(b=>b.onclick=()=>{const[k,id]=b.dataset.ed.split(":");go({name:"entry",kind:k,id})});
};
VIEWS.entry=function(){

  </tbody></table></div>

    <div class="card-h"><div><h3>Mapa de correlações</h3><p>Todas as variáveis contra todas. Azul = negativa, laranja = positiva; * = significativa depois de corrigir para muitas comparações (Benjamini-Hochberg, p &lt; 0,05). Toque num quadrado para ver o gráfico.</p></div></div>

    ${D.rows.map(r=>`<tr><td><b>${esc(shortName(e,r))}</b></td><td>${esc(r.grupo)}</td>${V.map(v=>`<td class="r num">${fmt(r.v[v.key],v.comp?0:2)}</td>`).join("")}</tr>`).join("")}</tbody></table></div></section>
  </div>`;
  const cols=e.grupos.map(g=>gc(e,g));

        const prompt=`Você é um especialista em etologia de ${s.especie.toLowerCase()}s fazendo uma análise comportamental por varredura instantânea.
Recebeu ${batch.length} imagem(ns), em ordem, de um vídeo de ${s.especie.toLowerCase()}s.${desc?` O animal que importa é: ${desc}.`:" Se houver vários animais, considere o mais visível no centro da imagem."}
Para cada imagem, diga quais comportamentos deste etograma o animal está fazendo naquele instante. Use SOMENTE nomes desta lista, escritos exatamente assim: ${names.map(n=>`"${n}"`).join(", ")}.
Normalmente marque uma atividade (ex.: Comendo, Ruminando, Ócio, Bebendo água) e uma postura (ex.: Deitada ou Em pé), se existirem na lista. Ruminação aparece como mastigação com o animal fora do cocho; se não der para ter certeza, use confiança baixa.
Responda apenas com JSON: um array com ${batch.length} objeto(s), na ordem das imagens, assim: [{"imagem":1,"comportamentos":["Ruminando","Deitada"],"confianca":0.8,"nota":"frase curta do que você vê"}]. Se o animal não estiver visível, use "comportamentos":[] e explique na nota.`;
        try{const out=await cl.sample.json(prompt,{images:batch.map(b=>b.blob),signal:ctl.signal,modelTier:"default"});

    finally{run.disabled=false;stop.hidden=true}};
  // Um quadro por horário (o primeiro dentro dele, como na varredura instantânea). A marcação revisada substitui a do horário.

  function paintResults(){const s=db.sessions.find(x=>x.id===vis.sid)||getS();const box=$("#frames",app);if(!box)return;$("#resCard",app).hidden=!vis.results.length;

      ${r.status==="done"?`<div>${s.comp.map(c=>`<button class="mini" data-f="${k}" data-c="${c.id}" style="border:0;${r.comps.includes(c.id)?"":"background:var(--surface-2);color:var(--muted);text-decoration:line-through"}">${esc(c.nome)}</button>`).filter((_,i)=>r.comps.includes(s.comp[i].id)||r.showAll).join("")}<button class="mini" data-more="${k}" style="border:0;background:transparent;color:var(--accent-text)">${r.showAll?"menos":"+ outro"}</button></div>`:""}
      ${r.nota?`<span class="note">${esc(r.nota)}</span>`:""}</div></div>`).join("");
    $$("[data-f]",box).forEach(b=>b.onclick=()=>{const r=vis.results[+b.dataset.f];const c=b.dataset.c;r.comps=r.comps.includes(c)?r.comps.filter(x=>x!==c):[...r.comps,c];paintResults()});
    $$("[data-more]",box).forEach(b=>b.onclick=()=>{const r=vis.results[+b.dataset.more];r.showAll=!r.showAll;paintResults()});}
